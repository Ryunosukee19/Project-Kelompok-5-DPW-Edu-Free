<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Diskusi | Edu-Free Dosen</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* TEMA & RESET DASAR */
        :root { --bg-dark: #0f172a; --bg-sidebar: #1e293b; --bg-card: rgba(30, 41, 59, 0.85); --primary: #38bdf8; --secondary: #c084fc; --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: rgba(255, 255, 255, 0.1); --sidebar-width: 260px; --danger-red: #ef4444; }
        body:has(#theme-toggle:checked) { --bg-dark: #f8fafc; --bg-sidebar: #ffffff; --bg-card: rgba(255, 255, 255, 0.9); --primary: #0284c7; --secondary: #9333ea; --text-main: #0f172a; --text-muted: #475569; --border-color: rgba(0, 0, 0, 0.1); }
        .icon-sun { display: none; } body:has(#theme-toggle:checked) .icon-moon { display: none; } body:has(#theme-toggle:checked) .icon-sun { display: inline; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; transition: all 0.3s ease; overflow-x: hidden; height: 100vh;}
        a { text-decoration: none; color: inherit; } ul { list-style: none; }

        /* SIDEBAR & LONCENG NOTIFIKASI */
        .sidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 1000; overflow-y: auto; }
        .sidebar::-webkit-scrollbar { width: 5px; } .sidebar::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 1.8rem; font-weight: 800; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; color: transparent; }
        
        .header-notif { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; transition: all 0.3s ease; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); }
        body:has(#theme-toggle:checked) .header-notif { background: rgba(0,0,0,0.05); }
        .header-notif:hover { background: rgba(56, 189, 248, 0.1); transform: scale(1.05); }
        .notif-count { position: absolute; top: -4px; right: -4px; background: var(--danger-red); color: white; width: 18px; height: 18px; border-radius: 50%; font-size: 0.7rem; display: none; justify-content: center; align-items: center; font-weight: bold; box-shadow: 0 0 8px var(--danger-red); animation: pulse 1.5s infinite; }

        /* DROPDOWN NOTIFIKASI */
        .notif-dropdown { position: fixed; top: 25px; left: 275px; width: 320px; background: var(--bg-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); display: flex; flex-direction: column; opacity: 0; visibility: hidden; transform: translateX(-15px); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); z-index: 2000; }
        .notif-dropdown.show { opacity: 1; visibility: visible; transform: translateX(0); }
        .notif-header { border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
        .notif-item { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border-color); }
        body:has(#theme-toggle:checked) .notif-item { background: rgba(0,0,0,0.05); }
        .notif-item span { color: var(--text-main); display: block; font-size: 0.9rem; font-weight: 500;}
        .notif-item small { color: var(--text-muted); font-size: 0.75rem;}
        .btn-mark-read { background: rgba(56, 189, 248, 0.15); color: var(--primary); border: none; padding: 8px 16px; border-radius: 10px; font-weight: 600; width: 100%; cursor: pointer; transition: 0.3s; margin-top: 10px;}
        
        .theme-switch-wrapper { padding: 15px 20px; border-bottom: 1px solid var(--border-color); } .theme-toggle-label { cursor: pointer; color: var(--text-muted); display: flex; gap: 10px; font-size: 0.95rem; font-weight: 500;} .theme-checkbox { display: none; } 
        .nav-links { padding-top: 15px; flex-grow: 1;} .nav-links li a { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; color: var(--text-muted); font-weight: 500; transition: all 0.3s ease; cursor: pointer;}
        .nav-links li a:hover { background-color: rgba(148, 163, 184, 0.1); color: var(--text-main); padding-left: 25px; }
        .nav-links li a.active { background-color: rgba(56, 189, 248, 0.15); color: var(--primary); border-left: 4px solid var(--primary); font-weight: 600; }

        /* KONTEN UTAMA & FORUM CHAT */
        .main-content { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); height: 100vh; padding: 30px 40px; display: flex; flex-direction: column;}
        .top-header { margin-bottom: 20px; } .top-header h2 { font-size: 2.2rem; margin-bottom: 5px; } .top-header p { color: var(--text-muted); }
        
        .chat-container { flex: 1; background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .chat-header { padding: 20px; border-bottom: 1px solid var(--border-color); background: rgba(0,0,0,0.1); font-weight: 600; font-size: 1.1rem; color: var(--primary); display: flex; align-items: center; gap: 10px;}
        body:has(#theme-toggle:checked) .chat-header { background: rgba(0,0,0,0.02); }
        
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .chat-messages::-webkit-scrollbar { width: 6px; } .chat-messages::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        
        .msg-wrapper { display: flex; flex-direction: column; max-width: 75%; }
        .msg-wrapper.me { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.other { align-self: flex-start; align-items: flex-start; }
        
        .msg-info { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 5px; display: flex; gap: 8px; align-items: center; }
        .msg-info .role-badge { padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 0.65rem; }
        .role-badge.dosen { background: rgba(192, 132, 252, 0.2); color: var(--secondary); }
        .role-badge.mahasiswa { background: rgba(56, 189, 248, 0.2); color: var(--primary); }

        .msg-bubble { padding: 12px 18px; border-radius: 16px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word;}
        .msg-wrapper.me .msg-bubble { background: linear-gradient(135deg, var(--primary), #0284c7); color: #fff; border-bottom-right-radius: 2px; }
        .msg-wrapper.other .msg-bubble { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-bottom-left-radius: 2px; }
        body:has(#theme-toggle:checked) .msg-wrapper.other .msg-bubble { background: rgba(0,0,0,0.05); }

        .chat-input-area { padding: 20px; border-top: 1px solid var(--border-color); display: flex; gap: 15px; background: rgba(0,0,0,0.2); }
        body:has(#theme-toggle:checked) .chat-input-area { background: rgba(0,0,0,0.02); }
        .chat-input { flex: 1; padding: 15px 20px; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 12px; font-size: 0.95rem; outline: none; transition: 0.3s; }
        .chat-input:focus { border-color: var(--primary); }
        .btn-send { background: var(--primary); color: #0f172a; border: none; width: 50px; height: 50px; border-radius: 12px; font-size: 1.2rem; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.3s; }
        .btn-send:hover { transform: scale(1.05); background: #0284c7; color: #fff;}
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="logo">Edu-Free.</div>
            
        </div>
        <div class="theme-switch-wrapper">
            <input type="checkbox" id="theme-toggle" class="theme-checkbox">
            <label for="theme-toggle" class="theme-toggle-label">
                <span class="icon-moon">🌙 Mode Gelap</span>
                <span class="icon-sun">☀️ Mode Terang</span>
            </label>
        </div>
        <ul class="nav-links">
            <li><a href="indexlogindosen.html">Beranda</a></li>
            <li><a href="uploadmateri.html">Upload Materi</a></li>
            <li><a href="uploadtugas.html">Upload Tugas</a></li>
            <li><a href="uploadkuis.html">Upload Kuis</a></li>
            <li><a href="daftarmahasiswa.html">Upload Nilai</a></li>
            <li><a href="absensidosen.html">Absensi</a></li>
            <li><a href="uploaduts_uas.html">Upload UTS/UAS</a></li>
            <li><a href="forumkomunikasidosen.html" class="active">Forum Diskusi</a></li>
            <li><a href="#" id="logout-sidebar" style="color: var(--danger-red);"></a></li>
        </ul>
    </nav>


    <main class="main-content">
        <header class="top-header">
            <h2>Forum Diskusi Kelas</h2>
            <p>Pantau dan jawab pertanyaan mahasiswa di sini.</p>
        </header>

        <div class="chat-container">
            <div class="chat-header">
                <i class="fas fa-comments"></i> Ruang Diskusi Terbuka (IF 2B)
            </div>
            
            <div class="chat-messages" id="chat-messages">
                </div>

            <form class="chat-input-area" id="chat-form">
                <input type="text" id="chat-input" class="chat-input" placeholder="Ketik balasan Anda di sini..." autocomplete="off" required>
                <button type="submit" class="btn-send"><i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Cek User Dosen
            const activeUser = JSON.parse(localStorage.getItem('loggedInUser'));
            if (!activeUser || activeUser.role !== 'dosen') { window.location.href = "login.html"; return; }

            const idDosen = activeUser.userId || activeUser.nip || "Dosen01";
            const namaDosen = activeUser.nama || "Dosen Pengampu";

            document.getElementById('logout-sidebar').addEventListener('click', () => { localStorage.removeItem('loggedInUser'); window.location.href = "index.html"; });
            
            const themeToggle = document.getElementById("theme-toggle");
            if (localStorage.getItem("theme") === "light") { themeToggle.checked = true; }
            themeToggle.addEventListener("change", function() { localStorage.setItem("theme", this.checked ? "light" : "dark"); });

            // =====================================
            // 2. LOGIKA FORUM (DENGAN PERISAI ANTI-ERROR)
            // =====================================
            const chatMessages = document.getElementById('chat-messages');
            const chatForm = document.getElementById('chat-form');
            const chatInput = document.getElementById('chat-input');

            function loadChat() {
                try {
                    const dbForumRaw = localStorage.getItem('global_database_forum');
                    let dbForum = [];
                    if (dbForumRaw) {
                        dbForum = JSON.parse(dbForumRaw);
                        if (!Array.isArray(dbForum)) dbForum = []; // Failsafe
                    }

                    chatMessages.innerHTML = "";

                    if(dbForum.length === 0) {
                        chatMessages.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top: auto; margin-bottom: auto;">Belum ada percakapan di kelas ini.</div>`;
                        return;
                    }

                    dbForum.forEach(msg => {
                        // PERISAI: Lewati data jika rusak/kosong (menghindari error)
                        if (!msg || typeof msg !== 'object' || !msg.senderId) return;

                        const isMe = String(msg.senderId) === String(idDosen);
                        const wrapperClass = isMe ? "me" : "other";
                        const roleClass = msg.senderRole === "dosen" ? "dosen" : "mahasiswa";
                        const roleText = msg.senderRole === "dosen" ? "Dosen" : "Mahasiswa";

                        const senderName = msg.senderName || "Pengguna";
                        const senderId = msg.senderId || "-";
                        const time = msg.time || "--:--";

                        const infoHTML = isMe 
                            ? `<span>${time}</span> <b>Anda</b> <span class="role-badge ${roleClass}">${roleText}</span>` 
                            : `<span class="role-badge ${roleClass}">${roleText}</span> <b>${senderName} (${senderId})</b> <span>${time}</span>`;

                        chatMessages.innerHTML += `
                            <div class="msg-wrapper ${wrapperClass}">
                                <div class="msg-info">${infoHTML}</div>
                                <div class="msg-bubble">${msg.text}</div>
                            </div>
                        `;
                    });
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                } catch (err) {
                    console.error("Gagal merender chat:", err);
                }
            }

            chatForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const text = chatInput.value.trim();
                if(!text) return;

                try {
                    let dbForum = JSON.parse(localStorage.getItem('global_database_forum')) || [];
                    if (!Array.isArray(dbForum)) dbForum = [];

                    const now = new Date();
                    const timeString = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');

                    dbForum.push({
                        id: Date.now(),
                        senderId: idDosen,
                        senderName: namaDosen,
                        senderRole: "dosen",
                        text: text,
                        time: timeString
                    });

                    localStorage.setItem('global_database_forum', JSON.stringify(dbForum));
                    chatInput.value = ""; 
                    loadChat();           
                } catch (err) {
                    console.error("Gagal mengirim chat:", err);
                }
            });
            
            // Real-time inter-tab sync
            window.addEventListener('storage', function(e) {
                if(e.key === 'global_database_forum') { loadChat(); loadNotifikasi(); }
            });

            setInterval(() => { loadChat(); loadNotifikasi(); }, 2000);
            loadChat();
            loadNotifikasi();
        });
    </script>
</body>
</html>
