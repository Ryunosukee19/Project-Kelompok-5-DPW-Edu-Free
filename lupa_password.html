<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Edu-Free</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0d1321; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;}
        .auth-card { background-color: #151e32; padding: 40px; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); }
        .logo { font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 20px; }
        .logo .edu { color: #38bdf8; } .logo .free { color: #c084fc; }
        .auth-title { font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 10px; }
        .auth-subtitle { font-size: 13px; color: #9ca3af; text-align: center; margin-bottom: 30px; }
        
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; }
        .input-group input, .input-group textarea { width: 100%; padding: 12px 15px; background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #ffffff; outline: none; font-size: 14px;}
        .input-group input:focus, .input-group textarea:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        
        .btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: white; border: none; border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4); }
        .btn-secondary { background: transparent; border: 1px solid #334155; margin-top: 15px; color: #9ca3af; }
        .btn-secondary:hover { border-color: #fff; color: #fff; box-shadow: none; transform: none;}
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo"><span class="edu">Edu</span><span class="free">-Free.</span></div>
        <h2 class="auth-title">Ajukan Reset Password</h2>
        <p class="auth-subtitle">Permintaan akan ditinjau oleh Administrator.</p>
        
        <form id="resetForm">
            <div class="input-group">
                <label>Nama Lengkap (Sesuai Akun)</label>
                <input type="text" id="req-nama" required autocomplete="off">
            </div>
            <div class="input-group">
                <label>NIM / NIP / ID Asprak</label>
                <input type="number" id="req-id" required autocomplete="off">
            </div>
            <div class="input-group">
                <label>Password Baru yang Diinginkan</label>
                <input type="text" id="req-passbaru" required autocomplete="off">
            </div>
            <div class="input-group">
                <label>Alasan Ingin Mengubah Password</label>
                <textarea id="req-alasan" rows="3" required placeholder="Contoh: Lama tidak login, lupa catat, dll..."></textarea>
            </div>
            
            <button type="submit" class="btn-primary">Kirim Permintaan ke Admin</button>
            <button type="button" class="btn-primary btn-secondary" onclick="window.location.href='login.html'">Kembali ke Login</button>
        </form>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nama = document.getElementById('req-nama').value;
            const id = document.getElementById('req-id').value;
            const passBaru = document.getElementById('req-passbaru').value;
            const alasan = document.getElementById('req-alasan').value;

            // Cek apakah akun dengan ID tersebut ada di sistem
            if (!localStorage.getItem(id)) {
                alert("Gagal! NIM/NIP tersebut tidak terdaftar di sistem kami.");
                return;
            }

            // Simpan permintaan ke localStorage khusus admin
            let requests = JSON.parse(localStorage.getItem('reset_password_requests')) || [];
            
            // Cek apakah pengguna sudah pernah request tapi belum di acc admin
            const isAlreadyRequested = requests.find(r => r.userId === id);
            if(isAlreadyRequested) {
                alert("Anda sudah mengirimkan permintaan sebelumnya. Harap tunggu Admin menyetujuinya.");
                return;
            }

            requests.push({
                reqId: Date.now(),
                nama: nama,
                userId: id,
                passwordBaru: passBaru,
                alasan: alasan,
                waktu: new Date().toLocaleString('id-ID')
            });

            localStorage.setItem('reset_password_requests', JSON.stringify(requests));
            alert("Permintaan Reset Password berhasil dikirim! Tunggu sekitar 2 menit lagi, baru Bisa login menggunakan password baru yang telah anda buat!. Jika ingin Cepat silahkan hubungi Nomor Developer pada Icon Wa di Halaman Utama!!.");
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
