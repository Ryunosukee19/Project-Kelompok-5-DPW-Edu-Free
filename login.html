<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk | Edu-Free</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0d1321; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-container { width: 100%; padding: 20px; display: flex; justify-content: center; }
        .auth-card { background-color: #151e32; padding: 40px; border-radius: 16px; width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        .logo { font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 20px; }
        .logo .edu { color: #38bdf8; } .logo .free { color: #c084fc; }
        .auth-title { font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 5px; }
        .auth-subtitle { font-size: 13px; color: #9ca3af; text-align: center; margin-bottom: 30px; }
        
        .input-group { margin-bottom: 20px; transition: all 0.3s ease; }
        .input-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; }
        .input-group input, .input-group select { width: 100%; padding: 12px 15px; background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #ffffff; font-size: 14px; outline: none; transition: all 0.3s ease; }
        .input-group input:focus, .input-group select:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        .input-group select option { background-color: #1e293b; color: #ffffff; }
        
        .btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: white; border: none; border-radius: 30px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4); transition: all 0.3s ease; margin-top: 10px; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.6); }
        
        .auth-switch { text-align: center; margin-top: 25px; font-size: 13px; color: #9ca3af; }
        .auth-switch a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .auth-switch a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="logo"><span class="edu">Edu</span><span class="free">-Free.</span></div>
            <h2 class="auth-title">Selamat Datang Kembali!</h2>
            <p class="auth-subtitle">Silakan masuk ke akun Anda.</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="login-role">Masuk Sebagai</label>
                    <select id="login-role" required>
                        <option value="mahasiswa" selected>Mahasiswa</option>
                        <option value="dosen">Dosen</option>
                        <option value="asprak">Asisten Praktikum</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="login-id" id="login-label-id">NIM</label>
                    <input type="text" id="login-id" placeholder="Masukkan NIM Anda" required autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Masukkan Password" required>
                </div>

                <button type="submit" class="btn-primary">Masuk</button>
            </form>

            <p class="auth-switch">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // LOGIKA DINAMIS MENGUBAH LABEL & TIPE INPUT
            const loginRole = document.getElementById('login-role');
            const loginLabelId = document.getElementById('login-label-id');
            const loginInputId = document.getElementById('login-id');

            loginRole.addEventListener('change', function() {
                if (this.value === 'dosen') {
                    loginLabelId.textContent = 'NIP';
                    loginInputId.placeholder = 'Masukkan NIP Anda';
                    loginInputId.type = 'number';
                } else if (this.value === 'asprak') {
                    loginLabelId.textContent = 'NIM / ID Asprak';
                    loginInputId.placeholder = 'Masukkan ID Anda';
                    loginInputId.type = 'number';
                } else if (this.value === 'admin') {
                    loginLabelId.textContent = 'Username Admin';
                    loginInputId.placeholder = 'Ketik Username Rahasia';
                    loginInputId.type = 'text'; // Karena username admin bisa berupa huruf
                } else {
                    loginLabelId.textContent = 'NIM';
                    loginInputId.placeholder = 'Masukkan NIM Anda';
                    loginInputId.type = 'number';
                }
                loginInputId.value = ''; // Kosongkan kolom setiap ganti peran
            });

            // LOGIKA VERIFIKASI SAAT TOMBOL MASUK DITEKAN
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', function(e) {
                    e.preventDefault(); 
                    
                    const inputRole = loginRole.value;
                    const inputId = loginInputId.value;
                    const inputPassword = document.getElementById('login-password').value;

                    // ==========================================
                    // 1. JALUR KHUSUS ADMIN (Tanpa Database)
                    // ==========================================
                    if (inputRole === 'admin') {
                        // SILAKAN UBAH USERNAME DAN PASSWORD INI SESUAI KESEPAKATAN KELOMPOK
                        const rahasiaUsername = "admin";
                        const rahasiaPassword = "190207";

                        if (inputId === rahasiaUsername && inputPassword === rahasiaPassword) {
                            alert("Akses Diberikan. Selamat Datang, Admin Tertinggi!");
                            
                            // Simpan sesi admin
                            localStorage.setItem('loggedInUser', JSON.stringify({
                                userId: inputId,
                                nama: "Super Admin",
                                role: "admin",
                                semester: "-",
                                matkul: []
                            }));

                            // Arahkan ke file Dashboard Admin
                            window.location.href = "index.html"; 
                        } else {
                            alert("Akses Ditolak! Username atau Password Admin salah.");
                        }
                        return; // Berhenti di sini, tidak lanjut ke Node.js
                    }

                    // ==========================================
                    // 2. JALUR MAHASISWA, DOSEN & ASPRAK (Pakai Database Node.js)
                    // ==========================================
                    const loginData = {
                        role: inputRole,
                        userId: inputId,
                        password: inputPassword
                    };

                    fetch('http://localhost:3000/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(loginData)
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert(`Selamat datang kembali, ${data.user.nama}!`);
                            
                            // Parsing array Matkul dari database
                            let matkulArray = [];
                            try { matkulArray = JSON.parse(data.user.matkul); } catch(err) {}

                            // Set sesi aktif ke LocalStorage agar dashboard bisa membacanya
                            localStorage.setItem('loggedInUser', JSON.stringify({
                                userId: data.user.id_user,
                                nama: data.user.nama,
                                role: data.user.role,
                                semester: data.user.semester,
                                matkul: matkulArray
                            }));

                            // Arahkan ke Dashboard sesuai peran
                            if (data.user.role === 'dosen' || data.user.role === 'asprak') {
                                window.location.href = "indexlogindosen.html";
                            } else {
                                if (data.user.semester === "1") window.location.href = "indexsetelahlogin.html"; 
                                else window.location.href = "indexsetelahlogin2.html"; 
                            }
                        } else {
                            alert(data.message); // Muncul jika Password salah atau NIM tidak terdaftar
                        }
                    })
                    .catch(err => {
                        console.error("Error Fetch:", err);
                        alert("Gagal terhubung ke server! Pastikan MySQL dan Node.js sudah menyala.");
                    });
                });
            }
        });
    </script>
</body>
</html>
