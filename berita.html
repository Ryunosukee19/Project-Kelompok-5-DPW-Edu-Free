<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berita | Edu Free - Platform Kursus Online</title>
    <link rel="stylesheet" href="styleindex.css">
    
    <style>
        /* =========================================
           1. LAYOUT DASAR & HEADER
        ========================================= */
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-main, #0f172a);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: inherit;
        }

        .nav-menu {
            display: flex;
            gap: 25px;
            margin-right: auto;
            margin-left: 50px;
            list-style: none;
            padding: 0;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-main, #fff);
            font-weight: 500;
        }

        .nav-link.active {
            color: var(--primary, #38bdf8);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 25px; 
        }

        .auth-buttons {
            display: flex;
            gap: 15px;
        }

        main {
            width: 100%;
        }

        /* =========================================
           2. CSS UNTUK HALAMAN BERITA
        ========================================= */
        .news-wrapper { padding: 40px 8%; max-width: 1200px; margin: 0 auto; min-height: 80vh; }
        .news-header { text-align: center; margin-bottom: 40px; }
        .news-header h2 { font-size: 2.5rem; color: var(--text-main, #fff); margin-bottom: 10px; }
        
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        .news-card {
            background: var(--bg-card, #1e293b);
            border: 1px solid var(--border-color, rgba(255,255,255,0.1));
            border-radius: 15px;
            padding: 25px;
            transition: transform 0.3s ease;
            color: var(--text-main, #fff);
            display: flex;
            flex-direction: column;
        }
        .news-card:hover { transform: translateY(-5px); border-color: var(--primary, #38bdf8); }
        
        .news-img-container {
            width: 100%; height: 180px; overflow: hidden;
            border-radius: 10px; margin-bottom: 15px; background: rgba(0,0,0,0.2);
        }
        .news-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .news-date { font-size: 0.85rem; color: var(--primary, #38bdf8); margin-bottom: 10px; display: block; }
        .news-title { font-size: 1.3rem; margin-bottom: 15px; }
        .news-desc { font-size: 0.95rem; line-height: 1.6; opacity: 0.8; white-space: pre-wrap; }

        /* --- TAMBAHAN UNTUK LINK DETAIL & MODAL --- */
        .detail-link {
            margin-top: auto; /* Memastikan link selalu berada di bawah kartu */
            color: var(--primary, #38bdf8);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: color 0.3s;
            display: inline-block;
        }
        .detail-link:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* Gaya Pop-up Modal */
        .modal-overlay {
            display: none; /* Sembunyikan secara default */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: var(--bg-card, #1e293b);
            color: var(--text-main, #fff);
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            border: 1px solid var(--border-color, rgba(255,255,255,0.1));
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            color: #ef4444;
            transition: 0.2s;
        }
        .modal-close:hover {
            color: #ff6b6b;
        }
        .modal-img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <a href="https://wa.me/082143511969" class="floating-wa" target="_blank" title="Hubungi Kami di WhatsApp">
    <img src="./logowa.png" alt="WhatsApp Icon" width="40" height="35">
    </a>
    
    <header>
        <div class="logo">Edu-Free.</div>
        
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link">Beranda</a></li>
            <li><a href="tim.html" class="nav-link">Tim Kami</a></li>
            <li><a href="tentang.html" class="nav-link">Tentang</a></li>
            <li><a href="berita.html" class="active nav-link">Berita</a></li>
        </ul>

        <div class="header-right">
            <div class="auth-buttons">
                <a href="login.html"><button class="btn btn-login">Masuk</button></a>
                <a href="register.html"><button class="btn btn-register">Daftar Gratis</button></a>
            </div>
            
            <input type="checkbox" id="theme-toggle" class="theme-checkbox" hidden>
            <label for="theme-toggle" class="theme-toggle-label">
                <span class="icon-moon">🌙Gelap</span>
                <span class="icon-sun">☀️Terang</span>
            </label>
        </div>
    </header>

    <main>
        <div class="news-wrapper">
            <div class="news-header">
                <h2>Berita & Artikel IT Terbaru</h2>
                <p style="color: var(--text-muted, #aaa); margin-top: 10px;">Informasi terbaru seputar platform Edu-Free.</p>
            </div>
            
            <div class="news-grid" id="news-container">
                </div>
        </div>
    </main>

    <div id="detail-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close" onclick="tutupDetail()">&times;</span>
            <div id="modal-image-container"></div>
            <span id="modal-date" class="news-date" style="margin-top: 10px;"></span>
            <h2 id="modal-title" style="margin-bottom: 20px; font-size: 1.8rem;"></h2>
            <div id="modal-desc" class="news-desc"></div>
        </div>
    </div>

    <script>
        // 1. Logika Toggle Tema
        const themeToggle = document.getElementById("theme-toggle");
        if (localStorage.getItem("theme") === "light") { themeToggle.checked = true; }
        themeToggle.addEventListener("change", function() {
            if (this.checked) { localStorage.setItem("theme", "light"); } 
            else { localStorage.setItem("theme", "dark"); }
        });

        // 2. LOGIKA LOAD BERITA
        function loadNews() {
            const newsDatabase = JSON.parse(localStorage.getItem('eduFreeNewsWithImage')) || [];
            const container = document.getElementById('news-container');
            container.innerHTML = ''; 

            if (newsDatabase.length === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column: 1 / -1; color: var(--text-muted, #aaa); margin-top: 20px;">Belum ada berita yang dipublikasikan saat ini.</p>';
                return; 
            }

            [...newsDatabase].reverse().forEach(news => {
                let imageHTML = '';
                if (news.imageBase64) {
                    imageHTML = `
                        <div class="news-img-container">
                            <img src="${news.imageBase64}" alt="Thumbnail Berita">
                        </div>
                    `;
                }

                // Perhatikan: Menghilangkan deskripsi dari kartu dan menambahkan link detail
                const newsHTML = `
                    <div class="news-card">
                        ${imageHTML}
                        <span class="news-date">📅 ${news.date}</span>
                        <h3 class="news-title">${news.title}</h3>
                        <a href="#" class="detail-link" onclick="bukaDetail(${news.id}); return false;">Lihat Detail</a>
                    </div>
                `;
                container.innerHTML += newsHTML;
            });
        }

        // 3. LOGIKA UNTUK MODAL DETAIL BERITA
        function bukaDetail(id) {
            const newsDatabase = JSON.parse(localStorage.getItem('eduFreeNewsWithImage')) || [];
            const news = newsDatabase.find(n => n.id === id); // Cari berita berdasarkan ID
            
            if(news) {
                // Isi konten modal dengan data berita
                document.getElementById('modal-title').innerText = news.title;
                document.getElementById('modal-date').innerText = `📅 ${news.date}`;
                document.getElementById('modal-desc').innerText = news.desc;
                
                const imgContainer = document.getElementById('modal-image-container');
                if(news.imageBase64) {
                    imgContainer.innerHTML = `<img src="${news.imageBase64}" class="modal-img" alt="Gambar Berita">`;
                } else {
                    imgContainer.innerHTML = ''; // Kosongkan jika tidak ada gambar
                }

                // Tampilkan modal
                document.getElementById('detail-modal').style.display = 'flex';
            }
        }

        function tutupDetail() {
            document.getElementById('detail-modal').style.display = 'none';
        }

        // Tutup modal jika user mengklik area gelap di luar kotak modal
        window.onclick = function(event) {
            const modal = document.getElementById('detail-modal');
            if (event.target === modal) {
                tutupDetail();
            }
        }

        // Jalankan fungsi load saat halaman berita dibuka
        loadNews();
    </script>
</body>
</html>
