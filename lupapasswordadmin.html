</head>

        <aside class="sidebar">

                    </summary>
                    <div class="submenu-content">
                        <a href="peserta.html" class="sub-menu-item">Mahasiswa</a>
                        <a href="dosen.html" class="sub-menu-item">Dosen</a>
                    </div>
                </details>

                <details class="menu-group">
                    <summary class="menu-item">
                        <i class="fas fa-book"></i> Mata Kuliah <i class="fas fa-chevron-down arrow"></i>
                    </summary>
                    <div class="submenu-content">
                        <a href="matakuliah.html" class="sub-menu-item">Semester 1</a>
                        <a href="matakuliah2.html" class="sub-menu-item">Semester 2</a>

                    </div>
                </details>

                <a href="beritaadmin.html" class="menu-item"><i class="fas fa-newspaper"></i> Kelola Berita</a>
                <a href="lupapasswordadmin.html" class="menu-item active"><i class="fas fa-file-invoice"></i>Lupa Password</a>

            </nav>

        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search here...">
                </div>
                <div class="user-profile">
                    <i class="far fa-bell"></i>
                    <i class="far fa-comment-dots"></i>
                    <div class="profile-info">
                        <span class="name">Super Admin</span>
                        <span class="role">Admin</span>
                    </div>
                </div>
            </header>

            <section class="page-control-panel">
                <div class="panel-left">
                    <h2>Permintaan Reset Password</h2>
                    <p style="color: #888; font-size: 14px; margin-top: 5px;">Tinjau permintaan perubahan password dari pengguna.</p>
                </div>
            </section>

            <section class="assignment-list-container" id="reset-requests-container">
                </section>

        </main>
    </div>

    <script>
        function loadResetRequests() {
            const container = document.getElementById('reset-requests-container');
            const requests = JSON.parse(localStorage.getItem('reset_password_requests')) || [];
            
            container.innerHTML = '';

            if (requests.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 50px; border: 1px dashed #ccc; border-radius: 12px; margin-top: 20px;">
                        <i class="fas fa-check-circle fa-3x" style="color: #10b981; margin-bottom: 15px;"></i>
                        <h3 style="color: #888;">Tidak ada permintaan reset password baru.</h3>
                    </div>`;
                return;
            }

            requests.reverse().forEach(req => {
                // Cek data aslinya untuk menampilkan Role/Peran saat ini
                const dataAsliText = localStorage.getItem(req.userId);
                let roleTeks = "Tidak Ditemukan";
                if(dataAsliText) {
                    const dataAsli = JSON.parse(dataAsliText);
                    roleTeks = dataAsli.role.toUpperCase();
                }

                let cardHTML = `
                    <div class="assignment-horizontal-card card-red" style="display: flex; gap: 20px;">
                        <div class="task-info-block" style="flex: 2;">
                            <h3 style="color: var(--text-dark); margin-bottom: 4px;">${req.nama}</h3>
                            <p style="font-weight: 600; color: var(--primary-color);">ID: ${req.userId} <span style="margin-left:10px; font-size:11px; background:#f1f1f1; padding:3px 8px; border-radius:10px; color:#555;">${roleTeks}</span></p>
                            <p style="font-size: 12px; color: #888; margin-top: 8px;"><i class="far fa-clock"></i> Waktu Pengajuan: ${req.waktu}</p>
                        </div>
                        
                        <div class="task-status-block" style="flex: 2.5; background: #fff5f5; padding: 10px 15px; border-radius: 8px; border-left: 3px solid #ef4444;">
                            <p style="font-size: 11px; color: #ef4444; font-weight: bold; margin-bottom: 5px;">ALASAN PENGGUNA:</p>
                            <p style="font-size: 13px; color: #555; font-style: italic;">"${req.alasan}"</p>
                        </div>

                        <div class="task-history-block" style="flex: 1.5; text-align: center;">
                            <p class="grade-label">Permintaan Password Baru</p>
                            <p class="grade-value" style="font-size: 16px; margin-top: 5px; border: 1px dashed var(--primary-color); padding: 5px; border-radius: 6px;">${req.passwordBaru}</p>
                        </div>

                        <div class="task-action-block" style="flex: 1.5; display: flex; flex-direction: column; gap: 10px; justify-content: center; align-items: flex-end;">
                            <button onclick="setujuiReset(${req.reqId}, '${req.userId}', '${req.passwordBaru}')" style="background: #10b981; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; width: 100%; transition: 0.3s;">
                                <i class="fas fa-check"></i> Setujui
                            </button>
                            <button onclick="tolakReset(${req.reqId})" style="background: white; color: #ef4444; border: 1px solid #ef4444; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; width: 100%; transition: 0.3s;">
                                <i class="fas fa-times"></i> Tolak
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // FUNGSI MENYETUJUI (Mengubah password di sistem)
        window.setujuiReset = function(reqId, userId, passwordBaru) {
            if(confirm(`Yakin ingin menyetujui reset password untuk akun ${userId}?`)) {
                // 1. Ubah password pengguna di database localStorage
                const userText = localStorage.getItem(userId);
                if (userText) {
                    const userData = JSON.parse(userText);
                    userData.password = passwordBaru; // Timpa password lama dengan yang baru
                    localStorage.setItem(userId, JSON.stringify(userData));
                    
                    // 2. Hapus request dari daftar antrean
                    hapusRequestDariList(reqId);
                    
                    alert("Berhasil! Password pengguna telah diperbarui.");
                    loadResetRequests(); // Muat ulang tampilan
                } else {
                    alert("Error: Akun pengguna tidak ditemukan di sistem!");
                }
            }
        };

        // FUNGSI MENOLAK PERMINTAAN
        window.tolakReset = function(reqId) {
            if(confirm("Yakin ingin menolak dan menghapus permintaan ini?")) {
                hapusRequestDariList(reqId);
                loadResetRequests();
            }
        };

        // FUNGSI HELPER MENGHAPUS DARI ARRAY
        function hapusRequestDariList(reqId) {
            let requests = JSON.parse(localStorage.getItem('reset_password_requests')) || [];
            requests = requests.filter(r => r.reqId !== reqId);
            localStorage.setItem('reset_password_requests', JSON.stringify(requests));
        }

        document.addEventListener('DOMContentLoaded', loadResetRequests);
    </script>
</body>
</html>
