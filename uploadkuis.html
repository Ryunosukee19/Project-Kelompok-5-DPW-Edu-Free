<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Kuis | Edu-Free Dosen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           TEMA & RESET DASAR
        ========================================= */
        :root {
            --bg-dark: #0f172a; --bg-sidebar: #1e293b; --bg-card: rgba(30, 41, 59, 0.85);
            --primary: #38bdf8; --secondary: #c084fc; --text-main: #f8fafc;
            --text-muted: #94a3b8; --border-color: rgba(255, 255, 255, 0.1); --sidebar-width: 260px;
            --success-green: #22c55e; --danger-red: #ef4444;
        }

        body:has(#theme-toggle:checked) {
            --bg-dark: #f8fafc; --bg-sidebar: #ffffff; --bg-card: rgba(255, 255, 255, 0.9);
            --primary: #0284c7; --secondary: #9333ea; --text-main: #0f172a;
            --text-muted: #475569; --border-color: rgba(0, 0, 0, 0.1); 
        }

        .icon-sun { display: none; }
        body:has(#theme-toggle:checked) .icon-moon { display: none; }
        body:has(#theme-toggle:checked) .icon-sun { display: inline; }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; transition: all 0.3s ease; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; } ul { list-style: none; }

        /* =========================================
           SIDEBAR NAVIGATION
        ========================================= */
        .sidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 1000; overflow-y: auto; }
        .sidebar::-webkit-scrollbar { width: 5px; } .sidebar::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        
        .logo { font-size: 1.8rem; font-weight: 800; padding: 25px 20px; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; background-clip: text; color: transparent; border-bottom: 1px solid var(--border-color); }
        .theme-switch-wrapper { padding: 15px 20px; border-bottom: 1px solid var(--border-color); } 
        .theme-toggle-label { cursor: pointer; color: var(--text-muted); display: flex; gap: 10px; font-size: 0.95rem; font-weight: 500;} 
        .theme-toggle-label:hover { color: var(--text-main); }
        .theme-checkbox { display: none; } 

        .nav-links { padding-top: 15px; padding-bottom: 30px; flex-grow: 1;}
        .nav-links li a { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; color: var(--text-muted); font-weight: 500; transition: all 0.3s ease; cursor: pointer;}
        .nav-links li a:hover { background-color: rgba(148, 163, 184, 0.1); color: var(--text-main); padding-left: 25px; }
        .nav-links li a.active { background-color: rgba(56, 189, 248, 0.15); color: var(--primary); border-left: 4px solid var(--primary); font-weight: 600; }

        /* =========================================
           KONTEN UTAMA
        ========================================= */
        .main-content { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); min-height: 100vh; padding: 40px; position: relative; }
        
        .top-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; }
        .header-title h2 { font-size: 2rem; font-weight: 700; margin-bottom: 5px; }
        .header-title p { color: var(--text-muted); font-size: 0.95rem; }

        /* =========================================
           TABEL UPLOAD KUIS
        ========================================= */
        .table-container { background: var(--bg-card); padding: 30px; border-radius: 20px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .table-header h3 { font-size: 1.3rem; font-weight: 600; color: var(--primary); }
        
        .btn-add { background: rgba(34, 197, 94, 0.15); color: var(--success-green); border: 1px solid rgba(34, 197, 94, 0.3); padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.3s ease; }
        .btn-add:hover { background: var(--success-green); color: #fff; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-weight: 500; font-size: 0.9rem;}
        /* Menggunakan var(--border-color) agar dinamis saat light mode */
        td { padding: 15px; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; color: var(--text-main); }
        tr:last-child td { border-bottom: none; }
        
        .btn-delete { background: rgba(239, 68, 68, 0.15); color: var(--danger-red); border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-delete:hover { background: var(--danger-red); color: #fff; }
        .link-badge { background: rgba(56, 189, 248, 0.15); color: var(--primary); padding: 4px 10px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: 500;}
        .link-badge:hover { text-decoration: underline; }

        /* =========================================
           MODAL FORM UPLOAD KUIS
        ========================================= */
        .modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: var(--bg-card); padding: 30px; border-radius: 20px; width: 100%; max-width: 450px; border: 1px solid var(--border-color); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .modal-content h3 { margin-bottom: 20px; font-size: 1.4rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted); font-weight: 500;}
        .form-group input, .form-group select { width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 10px; font-size: 0.95rem; outline: none; transition: 0.3s; }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); }
        body:has(#theme-toggle:checked) .form-group input, body:has(#theme-toggle:checked) .form-group select { background: rgba(0,0,0,0.05); color: #0f172a;}
        
        .btn-publish { background: linear-gradient(135deg, var(--primary), #0284c7); color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-publish:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56, 189, 248, 0.3); }
        .btn-cancel { background: transparent; border: none; color: var(--text-muted); width: 100%; padding: 10px; margin-top: 5px; cursor: pointer; font-weight: 500; }
        .btn-cancel:hover { color: var(--text-main); }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo">Edu-Free.</div>
        
        <div class="theme-switch-wrapper">
            <input type="checkbox" id="theme-toggle" class="theme-checkbox">
            <label for="theme-toggle" class="theme-toggle-label">
                <span class="icon-moon">🌙 Mode Gelap</span>
                <span class="icon-sun">☀️ Mode Terang</span>
            </label>
        </div>
        
        <ul class="nav-links">
            <li><a href="indexlogindosen.html">Beranda</a></li>
            <li><a href="uploadtugas.html">Upload Tugas</a></li>
            <li><a href="uploadkuis.html" class="active">Upload Kuis</a></li>
            <li><a href="uploadnilai.html">Upload Nilai</a></li>
            <li><a href="Absensi.html">Absensi</a></li>
            <li><a href="#" id="logout-sidebar" style="color: #ef4444;">Log out</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <div class="header-title">
                <h2>Rekap & Upload Kuis</h2>
                <p>Bagikan tautan kuis atau ujian secara *real-time* ke mahasiswa.</p>
            </div>
        </header>

        <section class="table-container">
            <div class="table-header">
                <h3>Daftar Kuis Aktif</h3>
                <button class="btn-add" onclick="document.getElementById('modalKuis').style.display='flex'">+ Buat Kuis Baru</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Judul Kuis</th>
                        <th>Tautan Kuis</th>
                        <th>Target Mahasiswa</th>
                        <th>Deadline</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabel-kuis-body">
                    </tbody>
            </table>
        </section>
    </main>

    <div id="modalKuis" class="modal-bg">
        <div class="modal-content">
            <h3>Upload Kuis Baru</h3>
            <div class="form-group">
                <label>Judul Kuis</label>
                <input type="text" id="kuis-judul" placeholder="Contoh: Kuis 1 Struktur Data" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label>Link Kuis (Google Form / Quizizz dll)</label>
                <input type="url" id="kuis-link" placeholder="https://forms.gle/..." autocomplete="off" required>
            </div>
            <div class="form-group">
                <label>Batas Waktu Pengerjaan</label>
                <input type="date" id="kuis-deadline" required>
            </div>
            <div class="form-group">
                <label>Target Mahasiswa</label>
                <select id="kuis-target">
                    <option value="Semua">Semua Mahasiswa Kelas IF 2B</option>
                    <option value="25041110157">Dwi Farhan Hidayat (25041110157)</option>
                    <option value="25041110145">Rifana Sari (25041110145)</option>
                    <option value="25041110206">Imel Fiana Safira (25041110206)</option>
                    <option value="25041110027">Rafli Alfarisi (25041110027)</option>
                </select>
            </div>
            <button class="btn-publish" onclick="simpanKuis()">Publish Kuis</button>
            <button class="btn-cancel" onclick="document.getElementById('modalKuis').style.display='none'">Batal</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Cek Login
            const activeUser = JSON.parse(localStorage.getItem('loggedInUser'));
            if (!activeUser || activeUser.role !== 'dosen') { 
                window.location.href = "login.html"; 
                return;
            }

            // 2. Load Tabel Kuis
            renderTabelKuis(); 

            // 3. Logika Log out
            document.getElementById('logout-sidebar').addEventListener('click', (e) => { 
                e.preventDefault();
                localStorage.removeItem('loggedInUser'); 
                window.location.href = "index.html"; 
            });

            // 4. Logika Switch Tema
            const themeToggle = document.getElementById("theme-toggle");
            if (localStorage.getItem("theme") === "light") themeToggle.checked = true;
            themeToggle.addEventListener("change", function() {
                if (this.checked) localStorage.setItem("theme", "light");
                else localStorage.setItem("theme", "dark");
            });
        });

        // FUNGSI SIMPAN KUIS KE DATABASE LOKAL
        function simpanKuis() {
            const judul = document.getElementById('kuis-judul').value.trim();
            const link = document.getElementById('kuis-link').value.trim();
            const deadline = document.getElementById('kuis-deadline').value;
            const target = document.getElementById('kuis-target').value;

            if(!judul || !link || !deadline) { 
                alert("Harap isi Judul, Link Kuis, dan Deadline!"); 
                return; 
            }

            // Simpan ke "global_database_kuis" agar beda laci dengan tugas biasa
            let databaseKuis = JSON.parse(localStorage.getItem('global_database_kuis')) || [];

            databaseKuis.push({
                id: Date.now(),
                judul: judul,
                link: link,
                deadline: deadline,
                target: target 
            });

            localStorage.setItem('global_database_kuis', JSON.stringify(databaseKuis));

            alert("Kuis berhasil dipublikasikan!");
            
            // Tutup modal & bersihkan form
            document.getElementById('modalKuis').style.display = 'none';
            document.getElementById('kuis-judul').value = "";
            document.getElementById('kuis-link').value = "";
            document.getElementById('kuis-deadline').value = "";
            
            renderTabelKuis();
        }

        // FUNGSI TAMPILKAN KUIS DI TABEL
        function renderTabelKuis() {
            let databaseKuis = JSON.parse(localStorage.getItem('global_database_kuis')) || [];
            const tabelBody = document.getElementById('tabel-kuis-body');
            tabelBody.innerHTML = "";

            if(databaseKuis.length === 0) {
                tabelBody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 25px; color: var(--text-muted);">Belum ada kuis yang diupload.</td></tr>`;
            } else {
                databaseKuis.forEach((kuis, index) => {
                    let targetText = kuis.target === 'Semua' ? 'Semua Mahasiswa' : `NIM: ${kuis.target}`;
                    tabelBody.innerHTML += `
                        <tr>
                            <td><b>${kuis.judul}</b></td>
                            <td><a href="${kuis.link}" target="_blank" class="link-badge">Buka Tautan 🔗</a></td>
                            <td>${targetText}</td>
                            <td>${kuis.deadline}</td>
                            <td><button class="btn-delete" onclick="hapusKuis(${index})">Hapus</button></td>
                        </tr>
                    `;
                });
            }
        }

        // FUNGSI HAPUS KUIS
        function hapusKuis(index) {
            if(confirm("Yakin ingin menghapus kuis ini?")) {
                let databaseKuis = JSON.parse(localStorage.getItem('global_database_kuis')) || [];
                databaseKuis.splice(index, 1);
                localStorage.setItem('global_database_kuis', JSON.stringify(databaseKuis));
                renderTabelKuis();
            }
        }
    </script>
</body>
</html>
