<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Data Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i> <span>EduFree</span>
            </div>
            
            <nav class="menu">
                <a href="indexadmin.html" class="menu-item"><i class="fas fa-home"></i> Home</a>
                
                <details class="menu-group active" open>
                    <summary class="menu-item">
                        <i class="fas fa-users"></i> Peserta <i class="fas fa-chevron-down arrow"></i>
                    </summary>
                    <div class="submenu-content">
                        <a href="peserta.html" class="sub-menu-item" style="color:var(--primary-color);">Mahasiswa</a>
                        <a href="dosen.html" class="sub-menu-item">Dosen</a>
                    </div>
                </details>

                <details class="menu-group">
                    <summary class="menu-item">
                        <i class="fas fa-book"></i> Mata Kuliah <i class="fas fa-chevron-down arrow"></i>
                    </summary>
                    <div class="submenu-content">
                        <a href="matakuliah.html" class="sub-menu-item">Semester 1</a>
                        <a href="matakuliah2.html" class="sub-menu-item">Semester 2</a>
                        <a href="matakuliah3.html" class="sub-menu-item">Semester 3</a>
                    </div>
                </details>
                <a href="beritaadmin.html" class="menu-item"><i class="fas fa-newspaper"></i> Kelola Berita</a>
                <a href="pengumpulan.html" class="menu-item"><i class="fas fa-file-invoice"></i> Pengumpulan Tugas</a>
                <a href="laporan_nilai.html" class="menu-item"><i class="fas fa-chart-bar"></i> Laporan Nilai</a>
                <a href="index.html" class="menu-item">Log Out</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search here...">
                </div>
                <div class="user-profile">
                    <i class="far fa-bell"></i>
                    <i class="far fa-comment-dots"></i>
                    <div class="profile-info">
                        <span class="name">Super Admin</span>
                        <span class="role">Admin</span>
                    </div>
                </div>
            </header>

            <section class="page-control-panel">
                <div class="panel-left">
                    <h2>Halaman Mahasiswa</h2>
                </div>
                <div class="panel-right">
                    <button class="btn-add-student"><i class="fas fa-plus"></i> Add Student</button>
                </div>
            </section>

            <section class="cards-layout-grid">
            </section>
        </main>
    </div>

    <div id="modalTambahMhs" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; padding: 25px; border-radius: 12px; width: 350px; color: #111; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
            <h3 style="margin-bottom: 15px; color: var(--primary-color);">Tambah Mahasiswa</h3>
            <input type="text" id="mhsNama" placeholder="Nama Lengkap" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; outline:none;">
            <input type="number" id="mhsNim" placeholder="NIM" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; outline:none;">
            <input type="text" id="mhsPass" placeholder="Password" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; outline:none;">
            <select id="mhsSmt" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; outline:none;">
                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
            </select>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="document.getElementById('modalTambahMhs').style.display='none'" style="padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; background: #eee;">Batal</button>
                <button onclick="simpanMahasiswa()" style="padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; background: var(--primary-color); color: white;">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        function muatDataMahasiswa() {
            const gridLayout = document.querySelector('.cards-layout-grid');
            gridLayout.innerHTML = ''; 

            let count = 0;
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                if (key !== 'loggedInUser' && key !== 'admin') {
                    try {
                        let user = JSON.parse(localStorage.getItem(key));
                        if (user && user.role === 'mahasiswa') {
                            count++;
                            let matkulList = user.matkul ? user.matkul.join(', ') : '-';
                            
                            let cardHTML = `
                                <div class="student-profile-card">
                                    <div class="card-action-menu" onclick="hapusAkun('${user.userId}')" style="cursor: pointer; color: #ef4444;" title="Hapus Akun"><i class="fas fa-trash"></i></div>
                                    <h3 class="student-card-name">${user.nama}</h3>
                                    <p class="student-card-id">NIM. ${user.userId}</p>
                                    <span class="badge badge-active">AKTIF</span>
                                    
                                    <div class="card-contact-info">
                                        <p><i class="fas fa-key"></i> Pass: <strong>${user.password}</strong></p>
                                        <p><i class="fas fa-layer-group"></i> Smt: ${user.semester}</p>
                                    </div>
                                    <div class="card-meta-details">
                                        <div class="meta-row"><span>Peran</span><strong style="text-transform: capitalize;">${user.role}</strong></div>
                                        <div class="meta-row"><span>Matkul</span><strong><marquee scrollamount="3" style="width: 80px;">${matkulList}</marquee></strong></div>
                                    </div>
                                </div>
                            `;
                            gridLayout.innerHTML += cardHTML;
                        }
                    } catch(e) {}
                }
            }

            if (count === 0) {
                gridLayout.innerHTML = '<h3 style="grid-column: 1 / -1; text-align: center; color: #888; padding: 50px;">Belum ada data Mahasiswa.</h3>';
            }
        }

        window.hapusAkun = function(id) {
            if(confirm("Yakin ingin menghapus akun dengan NIM: " + id + "?")) {
                localStorage.removeItem(id);
                muatDataMahasiswa();
            }
        };

        window.simpanMahasiswa = function() {
            const nama = document.getElementById('mhsNama').value;
            const id = document.getElementById('mhsNim').value;
            const pass = document.getElementById('mhsPass').value;
            const smt = document.getElementById('mhsSmt').value;

            if(!nama || !id || !pass) return alert("Harap isi semua kolom!");
            if(localStorage.getItem(id)) return alert("NIM ini sudah terdaftar!");

            const userData = {
                role: "mahasiswa",
                nama: nama,
                userId: id,
                password: pass,
                semester: smt,
                matkul: ["Didaftarkan Admin"] 
            };

            localStorage.setItem(id, JSON.stringify(userData));
            document.getElementById('modalTambahMhs').style.display = 'none'; 
            
            document.getElementById('mhsNama').value = '';
            document.getElementById('mhsNim').value = '';
            document.getElementById('mhsPass').value = '';
            
            muatDataMahasiswa(); 
            alert("Mahasiswa berhasil ditambahkan!");
        };

        document.addEventListener('DOMContentLoaded', () => {
            muatDataMahasiswa();
            
            const btnAdd = document.querySelector('.btn-add-student');
            if(btnAdd) {
                btnAdd.addEventListener('click', () => {
                    document.getElementById('modalTambahMhs').style.display = 'flex';
                });
            }
        });
    </script>
</body>
</html>
