<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Kelola Berita</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- TAMBAHAN CSS UNTUK FIX SIDEBAR --- */
        .container {
            display: flex;
            align-items: flex-start;
        }

        .sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        
        /* Menyembunyikan scrollbar bawaan di sidebar agar lebih rapi */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1; 
            border-radius: 10px;
        }
        /* -------------------------------------- */

        /* --- GAYA NOTIFIKASI ADVANCED --- */
        #notif-dropdown { display: none; position: absolute; top: 45px; right: 0; background: white; border: 1px solid #e5e7eb; border-radius: 12px; width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 9999; text-align: left; overflow: hidden;}
        .notif-header { padding: 12px 15px; font-weight: bold; background: #f8fafc; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center;}
        .notif-header button { background: none; border: none; font-size: 11px; cursor: pointer; font-weight: 600; padding: 5px 8px; border-radius: 4px; transition: 0.2s;}
        .notif-header button:hover { background: #e2e8f0; }
        .notif-item { padding: 12px 15px; border-bottom: 1px solid #e5e7eb; display: flex; gap: 10px; align-items: flex-start; transition: 0.2s;}
        .notif-item.unread { background-color: #f0f9ff; border-left: 3px solid #3b82f6; }
        .notif-item.read { opacity: 0.7; }
        .notif-icon { flex-shrink: 0; font-size: 16px; padding-top: 2px; }
        .notif-content { flex: 1; font-size: 12px; color: #334155; line-height: 1.4; }
        .notif-actions { flex-shrink: 0; display: flex; gap: 8px; font-size: 14px; }
        .notif-actions i { cursor: pointer; color: #94a3b8; transition: 0.2s; }
        .notif-actions i:hover { color: #0f172a; }
        .notif-actions i.fa-trash:hover { color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo"><i class="fas fa-graduation-cap"></i> <span>EduFree</span></div>
            <nav class="menu">
                <a href="indexadmin.html" class="menu-item"><i class="fas fa-home"></i> Home</a>
                <details class="menu-group">
                    <summary class="menu-item"><i class="fas fa-users"></i> Peserta <i class="fas fa-chevron-down arrow"></i></summary>
                    <div class="submenu-content"><a href="peserta.html" class="sub-menu-item">Mahasiswa</a><a href="dosen.html" class="sub-menu-item">Dosen</a></div>
                </details>
                <details class="menu-group">
                    <summary class="menu-item"><i class="fas fa-book"></i> Mata Kuliah <i class="fas fa-chevron-down arrow"></i></summary>
                    <div class="submenu-content"><a href="matakuliah.html" class="sub-menu-item">Semester 1</a><a href="matakuliah2.html" class="sub-menu-item">Semester 2</a></div>
                </details>
                <a href="beritaadmin.html" class="menu-item active"><i class="fas fa-newspaper"></i> Kelola Berita</a>
                <a href="lupapasswordadmin.html" class="menu-item"><i class="fas fa-file-invoice"></i> Lupa Password</a>
                <a href="laporan_nilai.html" class="menu-item"><i class="fas fa-chart-bar"></i> Laporan Nilai</a>
                <a href="kuisioneradmin.html" class="menu-item"><i class="fas fa-comment-dots"></i> Kuisioner</a>
                <a href="index.html" class="menu-item" style="margin-top: 20px; color: #ef4444;"><i class="fas fa-sign-out-alt"></i> Log Out</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <i class="fas fa-search"></i><input type="text" id="globalSearch" placeholder="Cari Judul Berita...">
                </div>
                <div class="user-profile" style="position: relative;">
                    <div style="position: relative; cursor: pointer;" onclick="toggleNotif()">
                        <i class="far fa-bell"></i>
                        <span id="notif-badge" style="display: none; position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; font-weight: bold;">0</span>
                    </div>
                    <div id="notif-dropdown">
                        <div class="notif-header">
                            <span>Notifikasi</span>
                            <div>
                                <button onclick="markAllRead()" style="color: #3b82f6;"><i class="fas fa-check-double"></i> Read All</button>
                                <button onclick="clearAllNotifications()" style="color: #ef4444;"><i class="fas fa-trash-alt"></i> Clear</button>
                            </div>
                        </div>
                        <div id="notif-list" style="max-height: 300px; overflow-y: auto;"></div>
                    </div>
                    <i class="far fa-comment-dots"></i>
                    <div class="profile-info"><span class="name">Super Admin</span><span class="role">Admin</span></div>
                </div>
            </header>

            <section class="page-control-panel">
                <div class="panel-left"><h2>Kelola Berita Utama</h2></div>
                <div class="panel-right"><button class="btn-add-student" onclick="bukaModalBerita()"><i class="fas fa-plus"></i> Tambah Berita</button></div>
            </section>
            <section class="assignment-list-container" id="news-container"></section>
        </main>
    </div>

    <div id="modalBerita" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center;">
        <div style="background: white; padding: 25px; border-radius: 12px; width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
            <h3 style="margin-bottom: 15px; color: var(--primary-color);">Tulis Berita Baru</h3>
            <label style="font-size: 13px; color: #555; font-weight: 600;">Judul Berita</label>
            <input type="text" id="beritaJudul" placeholder="Masukkan judul..." style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px;">
            <label style="font-size: 13px; color: #555; font-weight: 600;">Lampirkan Foto (Ops. Maks 2MB)</label>
            <input type="file" id="beritaGambar" accept="image/*" onchange="previewImage(event)" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; border: 1px dashed #ccc; border-radius: 6px; cursor: pointer;">
            <div id="previewContainer" style="display: none; margin-bottom: 15px; text-align: center;">
                <img id="previewImg" src="" alt="Preview" style="max-width: 100%; max-height: 150px; border-radius: 8px; object-fit: cover;">
                <button onclick="hapusPreview()" style="display: block; margin: 5px auto 0; padding: 5px 10px; font-size: 11px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer;">Batal Foto</button>
            </div>
            <label style="font-size: 13px; color: #555; font-weight: 600;">Isi Berita</label>
            <textarea id="beritaIsi" rows="5" placeholder="Tulis pengumuman di sini..." style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; resize: vertical;"></textarea>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="tutupModalBerita()" style="padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer;">Batal</button>
                <button onclick="simpanBerita()" style="padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; background: var(--primary-color); color: white;">Publikasikan</button>
            </div>
        </div>
    </div>

    <script>
        const NEWS_STORAGE_KEY = 'eduFreeNewsWithImage';
        let base64String = "";

        // --- 1. SEARCH & NOTIF GLOBAL ---
        document.getElementById('globalSearch').addEventListener('input', function(e) {
            let keyword = e.target.value.toLowerCase();
            document.querySelectorAll('.searchable-item').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(keyword) ? '' : 'none';
            });
        });

        function toggleNotif() { document.getElementById('notif-dropdown').style.display = document.getElementById('notif-dropdown').style.display === 'none' ? 'block' : 'none'; }
        
        function syncNotifications() {
            let notifs = JSON.parse(localStorage.getItem('admin_notifs')) || [];
            let reqPassword = JSON.parse(localStorage.getItem('reset_password_requests')) || [];
            reqPassword.forEach(req => { let id = 'pwd_'+req.reqId; if(!notifs.find(n=>n.id===id)) notifs.push({id, type:'pwd', icon:'fa-key', color:'#eab308', text:`Reset password: <b>${req.nama}</b>`, isRead:false, isDeleted:false, time:req.waktu}); });
            let kuisioner = JSON.parse(localStorage.getItem('kuisioner_admin')) || [];
            kuisioner.forEach(kuis => { let id = 'kuis_'+kuis.id; if(!notifs.find(n=>n.id===id)) notifs.push({id, type:'kuis', icon:'fa-comment-dots', color:'#3b82f6', text:`Evaluasi: <b>${kuis.matkul}</b>`, isRead:false, isDeleted:false, time:kuis.waktu}); });
            for(let i=0; i<localStorage.length; i++) {
                let key = localStorage.key(i);
                if(key !== 'loggedInUser' && key !== 'admin' && !key.includes('eduFree') && !key.includes('reset') && !key.includes('kuisioner') && !key.includes('notif') && !key.includes('matkul')) {
                    try { let user = JSON.parse(localStorage.getItem(key)); let id = 'user_'+user.userId; if(!notifs.find(n=>n.id===id)) notifs.push({id, type:'user', icon:'fa-user-plus', color:'#10b981', text:`Daftar: <b>${user.role.toUpperCase()}</b> (${user.nama})`, isRead:false, isDeleted:false, time:new Date().toLocaleDateString('id-ID')}); } catch(e){}
                }
            }
            localStorage.setItem('admin_notifs', JSON.stringify(notifs)); renderNotifications();
        }

        function renderNotifications() {
            let notifs = JSON.parse(localStorage.getItem('admin_notifs')) || [];
            let activeNotifs = notifs.filter(n => !n.isDeleted).reverse();
            let unreadCount = activeNotifs.filter(n => !n.isRead).length;
            const badge = document.getElementById('notif-badge'), list = document.getElementById('notif-list');
            badge.style.display = unreadCount > 0 ? 'block' : 'none'; badge.innerText = unreadCount;
            if(activeNotifs.length > 0) {
                list.innerHTML = activeNotifs.map(n => `<div class="notif-item ${n.isRead ? 'read' : 'unread'}"><div class="notif-icon"><i class="fas ${n.icon}" style="color:${n.color};"></i></div><div class="notif-content"><div>${n.text}</div><div style="font-size:10px; color:#94a3b8; margin-top:4px;">${n.time}</div></div><div class="notif-actions"><i class="fas ${n.isRead ? 'fa-envelope-open' : 'fa-envelope'}" onclick="toggleReadStatus('${n.id}')"></i> <i class="fas fa-trash" onclick="deleteNotification('${n.id}')"></i></div></div>`).join('');
            } else { list.innerHTML = '<div style="padding:20px; text-align:center; color:#94a3b8; font-size:13px;">Tidak ada notifikasi.</div>'; }
        }
        window.toggleReadStatus = function(id) { let notifs = JSON.parse(localStorage.getItem('admin_notifs')) || []; let target = notifs.find(n=>n.id===id); if(target){ target.isRead = !target.isRead; localStorage.setItem('admin_notifs', JSON.stringify(notifs)); renderNotifications(); } };
        window.deleteNotification = function(id) { let notifs = JSON.parse(localStorage.getItem('admin_notifs')) || []; let target = notifs.find(n=>n.id===id); if(target){ target.isDeleted = true; localStorage.setItem('admin_notifs', JSON.stringify(notifs)); renderNotifications(); } };
        window.markAllRead = function() { let notifs = JSON.parse(localStorage.getItem('admin_notifs')) || []; notifs.forEach(n=>{ if(!n.isDeleted) n.isRead=true; }); localStorage.setItem('admin_notifs', JSON.stringify(notifs)); renderNotifications(); };
        window.clearAllNotifications = function() { if(confirm("Hapus semua notifikasi?")) { let notifs = JSON.parse(localStorage.getItem('admin_notifs')) || []; notifs.forEach(n=>n.isDeleted=true); localStorage.setItem('admin_notifs', JSON.stringify(notifs)); renderNotifications(); } };

        // --- 2. LOGIKA KELOLA BERITA ---
        function bukaModalBerita() { document.getElementById('modalBerita').style.display = 'flex'; }
        function tutupModalBerita() { 
            document.getElementById('modalBerita').style.display = 'none';
            document.getElementById('beritaJudul').value = ''; document.getElementById('beritaIsi').value = ''; hapusPreview(); 
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                if(file.size > 2 * 1024 * 1024) { alert("Maksimal 2MB!"); hapusPreview(); return; }
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64String = e.target.result;
                    document.getElementById('previewImg').src = base64String;
                    document.getElementById('previewContainer').style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }
        function hapusPreview() { base64String = ""; document.getElementById('beritaGambar').value = ""; document.getElementById('previewContainer').style.display = 'none'; document.getElementById('previewImg').src = ""; }

        function muatBerita() {
            const container = document.getElementById('news-container');
            container.innerHTML = ''; 
            let dataBerita = JSON.parse(localStorage.getItem(NEWS_STORAGE_KEY)) || [];
            if (dataBerita.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 50px; color: #888;"><h3>Belum ada berita.</h3></div>'; return;
            }
            dataBerita.slice().reverse().forEach(berita => {
                let imgThumb = berita.imageBase64 ? `<img src="${berita.imageBase64}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 8px;">` : `<div style="width: 100px; height: 100px; background: #f1f3f6; border-radius: 8px; display:flex; align-items:center; justify-content:center; color:#ccc;"><i class="fas fa-image fa-2x"></i></div>`;
                container.innerHTML += `
                    <div class="assignment-horizontal-card searchable-item" style="display: flex; gap: 20px; align-items: flex-start;">
                        <div style="flex-shrink: 0;">${imgThumb}</div>
                        <div class="task-info-block" style="flex: 1;">
                            <h3 style="font-size: 16px; margin-bottom: 6px;">${berita.title}</h3>
                            <p style="color: var(--text-gray); font-size: 13px; margin-bottom: 10px;">${berita.desc}</p>
                            <p style="font-size: 11px; color: var(--primary-color); font-weight: 600;"><i class="far fa-clock"></i> ${berita.date}</p>
                        </div>
                        <div class="task-action-block" style="flex-shrink: 0; text-align: right;">
                            <button onclick="hapusBerita(${berita.id})" style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 16px; padding: 5px;"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
            });
        }

        window.simpanBerita = function() {
            const judul = document.getElementById('beritaJudul').value, isi = document.getElementById('beritaIsi').value;
            if(!judul || !isi) return alert("Harap isi Judul dan Isi!");
            const tglSekarang = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            let dataBerita = JSON.parse(localStorage.getItem(NEWS_STORAGE_KEY)) || [];
            dataBerita.push({ id: Date.now(), title: judul, desc: isi, date: tglSekarang, imageBase64: base64String });
            localStorage.setItem(NEWS_STORAGE_KEY, JSON.stringify(dataBerita));
            tutupModalBerita(); muatBerita(); alert("Berita berhasil dipublikasikan!");
        };

        window.hapusBerita = function(id) {
            if(confirm("Hapus berita ini?")) {
                let dataBerita = JSON.parse(localStorage.getItem(NEWS_STORAGE_KEY)) || [];
                dataBerita = dataBerita.filter(b => b.id !== id);
                localStorage.setItem(NEWS_STORAGE_KEY, JSON.stringify(dataBerita));
                muatBerita();
            }
        };

        document.addEventListener('DOMContentLoaded', () => { syncNotifications(); muatBerita(); });
    </script>
</body>
</html>
