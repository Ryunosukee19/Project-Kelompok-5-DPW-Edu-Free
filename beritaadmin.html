<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Kelola Berita</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i> <span>EduFree</span>
            </div>
            
            <nav class="menu">
                <a href="indexadmin.html" class="menu-item"><i class="fas fa-home"></i> Home</a>
                
                <details class="menu-group">
                    <summary class="menu-item">
                        <i class="fas fa-users"></i> Peserta <i class="fas fa-chevron-down arrow"></i>
                    </summary>
                    <div class="submenu-content">
                        <a href="peserta.html" class="sub-menu-item">Mahasiswa</a>
                        <a href="dosen.html" class="sub-menu-item">Dosen</a>
                    </div>
                </details>

                <details class="menu-group">
                    <summary class="menu-item">
                        <i class="fas fa-book"></i> Mata Kuliah <i class="fas fa-chevron-down arrow"></i>
                    </summary>
                    <div class="submenu-content">
                        <a href="matakuliah.html" class="sub-menu-item">Semester 1</a>
                        <a href="matakuliah2.html" class="sub-menu-item">Semester 2</a>
                        <a href="matakuliah3.html" class="sub-menu-item">Semester 3</a>
                    </div>
                </details>
                <a href="beritaadmin.html" class="menu-item active"><i class="fas fa-newspaper"></i> Kelola Berita</a>
                <a href="kuisioneradmin.html" class="menu-item"><i class="fas fa-newspaper">Kuisioner Admin</a>
                <a href="pengumpulan.html" class="menu-item"><i class="fas fa-file-invoice"></i> Pengumpulan Tugas</a>
                <a href="laporan_nilai.html" class="menu-item"><i class="fas fa-chart-bar"></i> Laporan Nilai</a>
                <a href="index.html" class="menu-item active">Log Out</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search here...">
                </div>
                <div class="user-profile">
                    <i class="far fa-bell"></i>
                    <i class="far fa-comment-dots"></i>
                    <div class="profile-info">
                        <span class="name">Super Admin</span>
                        <span class="role">Admin</span>
                    </div>
                </div>
            </header>

            <section class="page-control-panel">
                <div class="panel-left">
                    <h2>Kelola Berita Utama</h2>
                </div>
                <div class="panel-right">
                    <button class="btn-add-student" onclick="bukaModalBerita()"><i class="fas fa-plus"></i> Tambah Berita</button>
                </div>
            </section>

            <section class="assignment-list-container" id="news-container">
                </section>
        </main>
    </div>

    <div id="modalBerita" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; padding: 25px; border-radius: 12px; width: 500px; max-height: 90vh; overflow-y: auto; color: #111; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
            <h3 style="margin-bottom: 15px; color: var(--primary-color);">Tulis Berita Baru</h3>
            
            <label style="font-size: 13px; color: #555; font-weight: 600;">Judul Berita</label>
            <input type="text" id="beritaJudul" placeholder="Masukkan judul..." style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; outline:none;">
            
            <label style="font-size: 13px; color: #555; font-weight: 600;">Lampirkan Foto (Opsional)</label>
            <input type="file" id="beritaGambar" accept="image/*" onchange="previewImage(event)" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; border: 1px dashed #ccc; border-radius: 6px; outline:none; cursor: pointer;">
            
            <div id="previewContainer" style="display: none; margin-bottom: 15px; text-align: center;">
                <img id="previewImg" src="" alt="Preview" style="max-width: 100%; max-height: 150px; border-radius: 8px; object-fit: cover; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <button onclick="hapusPreview()" style="display: block; margin: 5px auto 0; padding: 5px 10px; font-size: 11px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer;">Batal Pilih Foto</button>
            </div>

            <label style="font-size: 13px; color: #555; font-weight: 600;">Isi Berita</label>
            <textarea id="beritaIsi" rows="5" placeholder="Tulis deskripsi atau pengumuman di sini..." style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; outline:none; font-family: inherit; resize: vertical;"></textarea>
            
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="tutupModalBerita()" style="padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; background: #eee; font-weight: 600;">Batal</button>
                <button onclick="simpanBerita()" style="padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; background: var(--primary-color); color: white; font-weight: 600;">Publikasikan</button>
            </div>
        </div>
    </div>

    <script>
        // Kunci penyimpanan harus sama persis dengan yang dipanggil di index.html
        const NEWS_STORAGE_KEY = 'eduFreeNewsWithImage';
        let base64String = ""; // Variabel penampung gambar

        // --- FUNGSI MODAL ---
        function bukaModalBerita() {
            document.getElementById('modalBerita').style.display = 'flex';
        }

        function tutupModalBerita() {
            document.getElementById('modalBerita').style.display = 'none';
            document.getElementById('beritaJudul').value = '';
            document.getElementById('beritaIsi').value = '';
            hapusPreview(); // Reset gambar
        }

        // --- FUNGSI PREVIEW GAMBAR (KONVERSI KE BASE64) ---
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                // Batasi ukuran file (misal maksimal 2MB) agar localStorage tidak cepat penuh
                if(file.size > 2 * 1024 * 1024) {
                    alert("Ukuran gambar terlalu besar! Maksimal 2MB.");
                    hapusPreview();
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    base64String = e.target.result; // Simpan teks Base64
                    document.getElementById('previewImg').src = base64String;
                    document.getElementById('previewContainer').style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        function hapusPreview() {
            base64String = "";
            document.getElementById('beritaGambar').value = ""; // Reset input file
            document.getElementById('previewContainer').style.display = 'none';
            document.getElementById('previewImg').src = "";
        }

        // --- FUNGSI RENDER BERITA DI HALAMAN ADMIN ---
        function muatBerita() {
            const container = document.getElementById('news-container');
            container.innerHTML = ''; 

            let dataBerita = JSON.parse(localStorage.getItem(NEWS_STORAGE_KEY)) || [];

            if (dataBerita.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 50px; color: #888;"><h3>Belum ada berita yang dipublikasikan.</h3></div>';
                return;
            }

            // Render dari yang terbaru
            dataBerita.slice().reverse().forEach(berita => {
                let imgThumb = '';
                if(berita.imageBase64) {
                    imgThumb = `<img src="${berita.imageBase64}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid #eaeaea;">`;
                } else {
                    imgThumb = `<div style="width: 100px; height: 100px; background: #f1f3f6; border-radius: 8px; display:flex; align-items:center; justify-content:center; color:#ccc;"><i class="fas fa-image fa-2x"></i></div>`;
                }

                let cardHTML = `
                    <div class="assignment-horizontal-card card-purple" style="display: flex; gap: 20px; align-items: flex-start;">
                        <div style="flex-shrink: 0;">
                            ${imgThumb}
                        </div>
                        <div class="task-info-block" style="flex: 1;">
                            <h3 style="font-size: 16px; color: var(--text-dark); margin-bottom: 6px;">${berita.title}</h3>
                            <p style="color: var(--text-gray); line-height: 1.5; font-size: 13px; margin-bottom: 10px;">${berita.desc}</p>
                            <p style="font-size: 11px; color: var(--primary-color); font-weight: 600;"><i class="far fa-clock"></i> ${berita.date}</p>
                        </div>
                        <div class="task-action-block" style="flex-shrink: 0; text-align: right;">
                            <button onclick="hapusBerita(${berita.id})" style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 16px; padding: 5px;" title="Hapus Berita">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // --- FUNGSI SIMPAN BERITA ---
        window.simpanBerita = function() {
            const judul = document.getElementById('beritaJudul').value;
            const isi = document.getElementById('beritaIsi').value;

            if(!judul || !isi) return alert("Harap isi Judul dan Isi berita!");

            // Tanggal format Indonesia
            const tglSekarang = new Date().toLocaleDateString('id-ID', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });

            // Format data disesuaikan dengan permintaan index.html
            const beritaBaru = {
                id: Date.now(),
                title: judul,
                desc: isi,
                date: tglSekarang,
                imageBase64: base64String // Akan terisi Base64 jika ada gambar, atau string kosong jika tidak ada
            };

            let dataBerita = JSON.parse(localStorage.getItem(NEWS_STORAGE_KEY)) || [];
            dataBerita.push(beritaBaru);
            localStorage.setItem(NEWS_STORAGE_KEY, JSON.stringify(dataBerita));

            tutupModalBerita();
            muatBerita(); 
            alert("Berita berhasil dipublikasikan! Silakan cek Beranda (index.html).");
        };

        // --- FUNGSI HAPUS BERITA ---
        window.hapusBerita = function(idBerita) {
            if(confirm("Yakin ingin menghapus berita ini? Halaman utama juga akan kehilangan berita ini.")) {
                let dataBerita = JSON.parse(localStorage.getItem(NEWS_STORAGE_KEY)) || [];
                dataBerita = dataBerita.filter(b => b.id !== idBerita);
                localStorage.setItem(NEWS_STORAGE_KEY, JSON.stringify(dataBerita));
                muatBerita();
            }
        };

        document.addEventListener('DOMContentLoaded', muatBerita);
    </script>
</body>
</html>
