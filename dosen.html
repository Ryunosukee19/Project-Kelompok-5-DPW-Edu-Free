<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Data Dosen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i> <span>EduFree</span>
            </div>
            
            <nav class="menu">
                <a href="indexadmin.html" class="menu-item"><i class="fas fa-home"></i> Home</a>
                
                <details class="menu-group active" open>
                    <summary class="menu-item">
                        <i class="fas fa-users"></i> Peserta <i class="fas fa-chevron-down arrow"></i>
                    </summary>
                    <div class="submenu-content active">
                        <a href="peserta.html" class="sub-menu-item">Mahasiswa</a>
                        <a href="dosen.html" class="sub-menu-item" style="color:var(--primary-color);">Dosen</a>
                    </div>
                </details>

                <details class="menu-group">
                    <summary class="menu-item">
                        <i class="fas fa-book"></i> Mata Kuliah <i class="fas fa-chevron-down arrow"></i>
                    </summary>
                    <div class="submenu-content">
                        <a href="matakuliah.html" class="sub-menu-item">Semester 1</a>
                        <a href="matakuliah2.html" class="sub-menu-item">Semester 2</a>
                        <a href="matakuliah3.html" class="sub-menu-item">Semester 3</a>
                    </div>
                </details>
                <a href="beritaadmin.html" class="menu-item"><i class="fas fa-newspaper"></i> Kelola Berita</a>
                <a href="kuisioneradmin.html" class="menu-item"><i class="fas fa-newspaper"></i>Kuisioner Admin</a>
                <a href="pengumpulan.html" class="menu-item"><i class="fas fa-file-invoice"></i> Pengumpulan Tugas</a>
                <a href="laporan_nilai.html" class="menu-item"><i class="fas fa-chart-bar"></i> Laporan Nilai</a>
                <a href="index.html" class="menu-item">Log Out</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search here...">
                </div>
                <div class="user-profile">
                    <i class="far fa-bell"></i>
                    <i class="far fa-comment-dots"></i>
                    <div class="profile-info">
                        <span class="name">Super Admin</span>
                        <span class="role">Admin</span>
                    </div>
                </div>
            </header>

            <section class="page-control-panel">
                <div class="panel-left">
                    <h2>Halaman Dosen & Asprak</h2>
                </div>
                <div class="panel-right">
                    <button class="btn-add-student" id="btnBukaModalDosen"><i class="fas fa-plus"></i> Add Dosen</button>
                </div>
            </section>

            <section class="cards-layout-grid">
            </section>
        </main>
    </div>

    <div id="modalTambahDosen" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; padding: 25px; border-radius: 12px; width: 400px; max-height: 90vh; overflow-y: auto; color: #111; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
            <h3 style="margin-bottom: 15px; color: var(--primary-color);">Tambah Pengajar</h3>
            
            <select id="pengajarRole" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; outline:none; font-weight:600;">
                <option value="dosen">Dosen</option>
                <option value="asprak">Asisten Praktikum (Asprak)</option>
            </select>
            
            <input type="text" id="pengajarNama" placeholder="Nama Lengkap" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; outline:none;">
            <input type="number" id="pengajarId" placeholder="NIP / ID Asprak" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; outline:none;">
            <input type="text" id="pengajarPass" placeholder="Password" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; outline:none;">
            
            <div id="matkulPengajarContainer" style="margin-bottom: 15px; text-align: left; max-height: 140px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; border-radius: 6px; font-size: 13px; background: #f9f9f9;">
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="document.getElementById('modalTambahDosen').style.display='none'" style="padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; background: #eee;">Batal</button>
                <button onclick="simpanPengajar()" style="padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; background: var(--primary-color); color: white;">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        // --- DAFTAR MATA KULIAH DISAMAKAN DENGAN REGISTER.HTML ---
        const matkulSem1 = ["PTI", "Alpro", "Matematika Teknik", "Matematika Diskret"];
        const matkulSem2 = ["Struktur Data", "DPW", "Orkom", "Metode Statistika", "Komputasi Aljabar Linier"];
        const semuaMatkul = [...matkulSem1, ...matkulSem2];
        const matkulAsprak = ["PTI", "Alpro", "Struktur Data", "DPW"];

        function renderMatkulPengajar() {
            const role = document.getElementById('pengajarRole').value;
            const container = document.getElementById('matkulPengajarContainer');
            
            let htmlContent = '<p style="margin-bottom: 4px; font-weight: 600; color: #555;">Pilih Mata Kuliah yang Diampu:</p>';

            if (role === 'dosen') {
                htmlContent += '<p style="font-size:11px; color:#ef4444; margin-bottom:8px;">(Hanya bisa memilih 1 Mata Kuliah)</p>';
                semuaMatkul.forEach(mk => {
                    htmlContent += `
                        <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px; cursor: pointer;">
                            <input type="radio" name="pilihanMatkulPengajar" value="${mk}"> ${mk}
                        </label>
                    `;
                });
                container.innerHTML = htmlContent;
                
            } else if (role === 'asprak') {
                htmlContent += '<p style="font-size:11px; color:#ef4444; margin-bottom:8px;">(Pilih maksimal 2 Mata Kuliah Praktikum)</p>';
                matkulAsprak.forEach(mk => {
                    htmlContent += `
                        <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px; cursor: pointer;">
                            <input type="checkbox" class="checkbox-asprak" value="${mk}"> ${mk}
                        </label>
                    `;
                });
                container.innerHTML = htmlContent;

                const asprakCheckboxes = document.querySelectorAll('.checkbox-asprak');
                asprakCheckboxes.forEach(cb => {
                    cb.addEventListener('change', function() {
                        const checkedCount = document.querySelectorAll('.checkbox-asprak:checked').length;
                        if (checkedCount > 2) {
                            this.checked = false; 
                            alert("Maksimal hanya boleh memilih 2 Mata Kuliah Praktikum!");
                        }
                    });
                });
            }
        }

        function muatDataPengajar() {
            const gridLayout = document.querySelector('.cards-layout-grid');
            gridLayout.innerHTML = ''; 

            let count = 0;
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                if (key !== 'loggedInUser' && key !== 'admin' && key !== 'eduFreeNewsWithImage' && key !== 'eduFreeNews') {
                    try {
                        let user = JSON.parse(localStorage.getItem(key));
                        if (user && (user.role === 'dosen' || user.role === 'asprak')) {
                            count++;
                            
                            let matkulList = user.matkul ? user.matkul.join(', ') : '-';
                            let labelId = user.role === 'dosen' ? 'NIP' : 'ID';
                            
                            let badgeClass = user.role === 'dosen' ? 'badge-active' : 'badge-inactive';
                            let badgeStyle = user.role === 'asprak' ? 'background-color: #e3f2fd; color: #1e88e5;' : '';

                            let cardHTML = `
                                <div class="student-profile-card">
                                    <div class="card-action-menu" onclick="hapusAkun('${user.userId}')" style="cursor: pointer; color: #ef4444;" title="Hapus Akun"><i class="fas fa-trash"></i></div>
                                    <h3 class="student-card-name">${user.nama}</h3>
                                    <p class="student-card-id">${labelId}. ${user.userId}</p>
                                    <span class="badge ${badgeClass}" style="${badgeStyle}">${user.role.toUpperCase()}</span>
                                    
                                    <div class="card-contact-info">
                                        <p><i class="fas fa-key"></i> Pass: <strong>${user.password}</strong></p>
                                    </div>
                                    <div class="card-meta-details">
                                        <div class="meta-row"><span>Mengajar</span><strong style="text-align:right; max-width: 100px;">${matkulList}</strong></div>
                                    </div>
                                </div>
                            `;
                            gridLayout.innerHTML += cardHTML;
                        }
                    } catch(e) {}
                }
            }

            if (count === 0) {
                gridLayout.innerHTML = '<h3 style="grid-column: 1 / -1; text-align: center; color: #888; padding: 50px;">Belum ada data Dosen atau Asprak.</h3>';
            }
        }

        window.hapusAkun = function(id) {
            if(confirm("Yakin ingin menghapus akun dengan ID: " + id + "?")) {
                localStorage.removeItem(id);
                muatDataPengajar();
            }
        };

        window.simpanPengajar = function() {
            const role = document.getElementById('pengajarRole').value;
            const nama = document.getElementById('pengajarNama').value;
            const id = document.getElementById('pengajarId').value;
            const pass = document.getElementById('pengajarPass').value;

            let arrayMatkulTerpilih = [];
            if (role === 'dosen') {
                const selectedRadio = document.querySelector('input[name="pilihanMatkulPengajar"]:checked');
                if (selectedRadio) arrayMatkulTerpilih.push(selectedRadio.value);
            } else if (role === 'asprak') {
                const selectedCheckboxes = document.querySelectorAll('.checkbox-asprak:checked');
                arrayMatkulTerpilih = Array.from(selectedCheckboxes).map(cb => cb.value);
            }

            if(!nama || !id || !pass) return alert("Harap isi Nama, NIP/ID, dan Password!");
            if(arrayMatkulTerpilih.length === 0) return alert("Harap pilih mata kuliah yang diampu!");
            if(localStorage.getItem(id)) return alert("NIP/ID ini sudah terdaftar!");

            const userData = {
                role: role,
                nama: nama,
                userId: id,
                password: pass,
                semester: "-",
                matkul: arrayMatkulTerpilih
            };

            localStorage.setItem(id, JSON.stringify(userData));
            
            document.getElementById('modalTambahDosen').style.display = 'none';
            document.getElementById('pengajarNama').value = '';
            document.getElementById('pengajarId').value = '';
            document.getElementById('pengajarPass').value = '';
            
            muatDataPengajar();
            alert(role.toUpperCase() + " berhasil ditambahkan beserta mata kuliahnya!");
        };

        document.addEventListener('DOMContentLoaded', () => {
            muatDataPengajar();
            
            const btnAdd = document.getElementById('btnBukaModalDosen');
            if(btnAdd) {
                btnAdd.addEventListener('click', () => {
                    document.getElementById('pengajarRole').value = 'dosen';
                    renderMatkulPengajar();
                    document.getElementById('modalTambahDosen').style.display = 'flex';
                });
            }

            const selectRole = document.getElementById('pengajarRole');
            if(selectRole) {
                selectRole.addEventListener('change', renderMatkulPengajar);
            }
        });
    </script>
</body>
</html>
