<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Data Dosen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i> <span>EduFree</span>
            </div>
            
            <nav class="menu">
                <a href="indexadmin.html" class="menu-item"><i class="fas fa-home"></i> Home</a>
                
                <details class="menu-group active" open>
                    <summary class="menu-item">
                        <i class="fas fa-users"></i> Peserta <i class="fas fa-chevron-down arrow"></i>
                    </summary>
                    <div class="submenu-content">
                        <a href="peserta.html" class="sub-menu-item">Mahasiswa</a>
                        <a href="dosen.html" class="sub-menu-item" style="color:var(--primary-color);">Dosen</a>
                    </div>
                </details>

                <details class="menu-group">
                    <summary class="menu-item">
                        <i class="fas fa-book"></i> Mata Kuliah <i class="fas fa-chevron-down arrow"></i>
                    </summary>
                    <div class="submenu-content">
                        <a href="matakuliah.html" class="sub-menu-item">Semester 1</a>
                        <a href="matakuliah2.html" class="sub-menu-item">Semester 2</a>
                        <a href="matakuliah3.html" class="sub-menu-item">Semester 3</a>
                    </div>
                </details>

                <a href="pengumpulan.html" class="menu-item"><i class="fas fa-file-invoice"></i> Pengumpulan Tugas</a>
                <a href="laporan_nilai.html" class="menu-item"><i class="fas fa-chart-bar"></i> Laporan Nilai</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search here...">
                </div>
                <div class="user-profile">
                    <i class="far fa-bell"></i>
                    <i class="far fa-comment-dots"></i>
                    <div class="profile-info">
                        <span class="name">Super Admin</span>
                        <span class="role">Admin</span>
                    </div>
                </div>
            </header>

            <section class="page-control-panel">
                <div class="panel-left">
                    <h2>Halaman Dosen & Asprak</h2>
                </div>
                <div class="panel-right">
                    <button class="btn-add-student"><i class="fas fa-plus"></i> Add Dosen</button>
                </div>
            </section>

            <section class="cards-layout-grid">
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gridLayout = document.querySelector('.cards-layout-grid');
            gridLayout.innerHTML = ''; 

            let count = 0;
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                if (key !== 'loggedInUser' && key !== 'admin') {
                    try {
                        let user = JSON.parse(localStorage.getItem(key));
                        if (user && (user.role === 'dosen' || user.role === 'asprak')) {
                            count++;
                            
                            let matkulList = user.matkul ? user.matkul.join(', ') : '-';
                            let labelId = user.role === 'dosen' ? 'NIP' : 'ID';
                            
                            let badgeClass = user.role === 'dosen' ? 'badge-active' : 'badge-inactive';
                            let badgeStyle = user.role === 'asprak' ? 'background-color: #e3f2fd; color: #1e88e5;' : '';

                            let cardHTML = `
                                <div class="student-profile-card">
                                    <div class="card-action-menu"><i class="fas fa-ellipsis-v"></i></div>
                                    <h3 class="student-card-name">${user.nama}</h3>
                                    <p class="student-card-id">${labelId}. ${user.userId}</p>
                                    <span class="badge ${badgeClass}" style="${badgeStyle}">${user.role.toUpperCase()}</span>
                                    
                                    <div class="card-contact-info">
                                        <p><i class="fas fa-key"></i> Pass: <strong>${user.password}</strong></p>
                                    </div>
                                    <div class="card-meta-details">
                                        <div class="meta-row"><span>Mengajar</span><strong style="text-align:right; max-width: 100px;">${matkulList}</strong></div>
                                    </div>
                                </div>
                            `;
                            gridLayout.innerHTML += cardHTML;
                        }
                    } catch(e) {}
                }
            }

            if (count === 0) {
                gridLayout.innerHTML = '<h3 style="grid-column: 1 / -1; text-align: center; color: #888; padding: 50px;">Belum ada data Dosen atau Asprak.</h3>';
            }
        });
    </script>
</body>
</html>
