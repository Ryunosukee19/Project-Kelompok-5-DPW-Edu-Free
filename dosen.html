<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Data Pengajar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- GAYA NOTIFIKASI ADVANCED --- */
        #notif-dropdown { display: none; position: absolute; top: 45px; right: 0; background: white; border: 1px solid #e5e7eb; border-radius: 12px; width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 9999; text-align: left; overflow: hidden;}
        .notif-header { padding: 12px 15px; font-weight: bold; background: #f8fafc; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center;}
        .notif-header button { background: none; border: none; font-size: 11px; cursor: pointer; font-weight: 600; padding: 5px 8px; border-radius: 4px; transition: 0.2s;}
        .notif-header button:hover { background: #e2e8f0; }
        .notif-item { padding: 12px 15px; border-bottom: 1px solid #e5e7eb; display: flex; gap: 10px; align-items: flex-start; transition: 0.2s;}
        .notif-item.unread { background-color: #f0f9ff; border-left: 3px solid #3b82f6; }
        .notif-item.read { opacity: 0.7; }
        .notif-icon { flex-shrink: 0; font-size: 16px; padding-top: 2px; }
        .notif-content { flex: 1; font-size: 12px; color: #334155; line-height: 1.4; }
        .notif-actions { flex-shrink: 0; display: flex; gap: 8px; font-size: 14px; }
        .notif-actions i { cursor: pointer; color: #94a3b8; transition: 0.2s; }
        .notif-actions i:hover { color: #0f172a; }
        .notif-actions i.fa-trash:hover { color: #ef4444; }
        
        .filter-container select { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; outline: none; font-family: inherit; }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i> <span>EduFree</span>
            </div>
            <nav class="menu">
                <a href="indexadmin.html" class="menu-item"><i class="fas fa-home"></i> Home</a>
                <details class="menu-group active" open>
                    <summary class="menu-item"><i class="fas fa-users"></i> Peserta <i class="fas fa-chevron-down arrow"></i></summary>
                    <div class="submenu-content">
                        <a href="peserta.html" class="sub-menu-item">Mahasiswa</a>
                        <a href="dosen.html" class="sub-menu-item" style="color:var(--primary-color);">Dosen</a>
                    </div>
                </details>
                <details class="menu-group">
                    <summary class="menu-item"><i class="fas fa-book"></i> Mata Kuliah <i class="fas fa-chevron-down arrow"></i></summary>
                    <div class="submenu-content">
                        <a href="matakuliah.html" class="sub-menu-item">Semester 1</a>
                        <a href="matakuliah2.html" class="sub-menu-item">Semester 2</a>
                        
                    </div>
                </details>
                <a href="beritaadmin.html" class="menu-item"><i class="fas fa-newspaper"></i> Kelola Berita</a>
                <a href="lupapasswordadmin.html" class="menu-item"><i class="fas fa-file-invoice"></i> Lupa Password</a>
                <a href="laporan_nilai.html" class="menu-item"><i class="fas fa-chart-bar"></i> Laporan Nilai</a>
                <a href="kuisioneradmin.html" class="menu-item"><i class="fas fa-comment-dots"></i> Kuisioner</a>
                <a href="index.html" class="menu-item" style="margin-top: 20px; color: #ef4444;"><i class="fas fa-sign-out-alt"></i> Log Out</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="globalSearch" placeholder="Cari Nama atau NIP/ID...">
                </div>
                <div class="user-profile" style="position: relative;">
                    <div style="position: relative; cursor: pointer;" onclick="toggleNotif()">
                        <i class="far fa-bell"></i>
                        <span id="notif-badge" style="display: none; position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; font-weight: bold;">0</span>
                    </div>
                    <div id="notif-dropdown">
                        <div class="notif-header">
                            <span>Notifikasi</span>
                            <div>
                                <button onclick="markAllRead()" style="color: #3b82f6;"><i class="fas fa-check-double"></i> Read All</button>
                                <button onclick="clearAllNotifications()" style="color: #ef4444;"><i class="fas fa-trash-alt"></i> Clear</button>
                            </div>
                        </div>
                        <div id="notif-list" style="max-height: 300px; overflow-y: auto;"></div>
                    </div>
                    <i class="far fa-comment-dots"></i>
                    <div class="profile-info"><span class="name">Super Admin</span><span class="role">Admin</span></div>
                </div>
            </header>

            <section class="page-control-panel">
                <div class="panel-left filter-container">
                    <h2>Halaman Dosen & Asprak</h2>
                    <div style="margin-top: 10px;">
                        <select id="filterSmtDosen" onchange="muatDataPengajar()">
                            <option value="all">Tampilkan Semua Pengajar</option>
                            <option value="1">Mengajar di Semester 1</option>
                            <option value="2">Mengajar di Semester 2</option>
                        </select>
                    </div>
                </div>
                <div class="panel-right">
                    <button class="btn-add-student" id="btnBukaModalDosen"><i class="fas fa-plus"></i> Add Pengajar</button>
                </div>
            </section>

            <section class="cards-layout-grid" id="data-container"></section>
        </main>
    </div>

    <div id="modalTambahDosen" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center;">
        <div style="background: white; padding: 25px; border-radius: 12px; width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
            <h3 style="margin-bottom: 15px; color: var(--primary-color);">Tambah Pengajar</h3>
            <select id="pengajarRole" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; font-weight:600;" onchange="renderMatkulPengajar()">
                <option value="dosen">Dosen</option>
                <option value="asprak">Asisten Praktikum (Asprak)</option>
            </select>
            <input type="text" id="pengajarNama" placeholder="Nama Lengkap" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px;">
            <input type="number" id="pengajarId" placeholder="NIP / ID Asprak" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px;">
            <input type="text" id="pengajarPass" placeholder="Password" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px;">
            <div id="matkulPengajarContainer" style="margin-bottom: 15px; max-height: 140px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; border-radius: 6px; font-size: 13px; background: #f9f9f9;"></div>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="document.getElementById('modalTambahDosen').style.display='none'" style="padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer;">Batal</button>
                <button onclick="simpanPengajar()" style="padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; background: var(--primary-color); color: white;">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        // Array Matkul Master
        const matkulSem1 = ["PTI", "Alpro", "Matematika Teknik", "Matematika Diskret"];
        const matkulSem2 = ["Struktur Data", "DPW", "Orkom", "Metode Statistika", "Komputasi Aljabar Linier"];
        const semuaMatkul = [...matkulSem1, ...matkulSem2];
        const matkulAsprak = ["PTI", "Alpro", "Struktur Data", "DPW"];

        // --- 1. SEARCH & NOTIFIKASI GLOBAL ---
        document.getElementById('globalSearch').addEventListener('input', function(e) {
            let keyword = e.target.value.toLowerCase();
            document.querySelectorAll('.student-profile-card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(keyword) ? '' : 'none';
            });
        });

        function toggleNotif() { document.getElementById('notif-dropdown').style.display = document.getElementById('notif-dropdown').style.display === 'none' ? 'block' : 'none'; }

        function syncNotifications() {
            let notifs = JSON.parse(localStorage.getItem('admin_notifs')) || [];
            
            // Sync Reset Password
            let reqPassword = JSON.parse(localStorage.getItem('reset_password_requests')) || [];
            reqPassword.forEach(req => { let id = 'pwd_'+req.reqId; if(!notifs.find(n=>n.id===id)) notifs.push({id, type:'pwd', icon:'fa-key', color:'#eab308', text:`Reset password: <b>${req.nama}</b>`, isRead:false, isDeleted:false, time:req.waktu}); });
            
            // Sync Kuisioner
            let kuisioner = JSON.parse(localStorage.getItem('kuisioner_admin')) || [];
            kuisioner.forEach(kuis => { let id = 'kuis_'+kuis.id; if(!notifs.find(n=>n.id===id)) notifs.push({id, type:'kuis', icon:'fa-comment-dots', color:'#3b82f6', text:`Evaluasi: <b>${kuis.matkul}</b>`, isRead:false, isDeleted:false, time:kuis.waktu}); });
            
            // Sync Registrasi Baru
            for(let i=0; i<localStorage.length; i++) {
                let key = localStorage.key(i);
                if(key !== 'loggedInUser' && key !== 'admin' && !key.includes('eduFree') && !key.includes('reset') && !key.includes('kuisioner') && !key.includes('notif')) {
                    try { let user = JSON.parse(localStorage.getItem(key)); let id = 'user_'+user.userId; if(!notifs.find(n=>n.id===id)) notifs.push({id, type:'user', icon:'fa-user-plus', color:'#10b981', text:`Daftar: <b>${user.role.toUpperCase()}</b> (${user.nama})`, isRead:false, isDeleted:false, time:new Date().toLocaleDateString('id-ID')}); } catch(e){}
                }
            }
            localStorage.setItem('admin_notifs', JSON.stringify(notifs)); renderNotifications();
        }

        function renderNotifications() {
            let notifs = JSON.parse(localStorage.getItem('admin_notifs')) || [];
            let activeNotifs = notifs.filter(n => !n.isDeleted).reverse();
            let unreadCount = activeNotifs.filter(n => !n.isRead).length;
            const badge = document.getElementById('notif-badge'), list = document.getElementById('notif-list');
            
            badge.style.display = unreadCount > 0 ? 'block' : 'none'; 
            badge.innerText = unreadCount;
            
            if(activeNotifs.length > 0) {
                list.innerHTML = activeNotifs.map(n => `<div class="notif-item ${n.isRead ? 'read' : 'unread'}"><div class="notif-icon"><i class="fas ${n.icon}" style="color:${n.color};"></i></div><div class="notif-content"><div>${n.text}</div><div style="font-size:10px; color:#94a3b8; margin-top:4px;">${n.time}</div></div><div class="notif-actions"><i class="fas ${n.isRead ? 'fa-envelope-open' : 'fa-envelope'}" onclick="toggleReadStatus('${n.id}')"></i> <i class="fas fa-trash" onclick="deleteNotification('${n.id}')"></i></div></div>`).join('');
            } else { list.innerHTML = '<div style="padding:20px; text-align:center; color:#94a3b8; font-size:13px;">Tidak ada notifikasi.</div>'; }
        }

        window.toggleReadStatus = function(id) { let notifs = JSON.parse(localStorage.getItem('admin_notifs')) || []; let target = notifs.find(n=>n.id===id); if(target){ target.isRead = !target.isRead; localStorage.setItem('admin_notifs', JSON.stringify(notifs)); renderNotifications(); } };
        window.deleteNotification = function(id) { let notifs = JSON.parse(localStorage.getItem('admin_notifs')) || []; let target = notifs.find(n=>n.id===id); if(target){ target.isDeleted = true; localStorage.setItem('admin_notifs', JSON.stringify(notifs)); renderNotifications(); } };
        window.markAllRead = function() { let notifs = JSON.parse(localStorage.getItem('admin_notifs')) || []; notifs.forEach(n=>{ if(!n.isDeleted) n.isRead=true; }); localStorage.setItem('admin_notifs', JSON.stringify(notifs)); renderNotifications(); };
        window.clearAllNotifications = function() { if(confirm("Hapus semua notifikasi?")) { let notifs = JSON.parse(localStorage.getItem('admin_notifs')) || []; notifs.forEach(n=>n.isDeleted=true); localStorage.setItem('admin_notifs', JSON.stringify(notifs)); renderNotifications(); } };

        // --- 2. FILTER & RENDER PENGAJAR ---
        function muatDataPengajar() {
            const grid = document.getElementById('data-container');
            grid.innerHTML = ''; 
            const filterSmt = document.getElementById('filterSmtDosen').value;
            let count = 0;

            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                if (key !== 'loggedInUser' && key !== 'admin' && !key.includes('eduFree') && !key.includes('reset') && !key.includes('kuisioner') && !key.includes('notif')) {
                    try {
                        let user = JSON.parse(localStorage.getItem(key));
                        if (user && (user.role === 'dosen' || user.role === 'asprak')) {
                            
                            // Logika Filter Semester Matkul yang Diampu
                            let ngajarSmt1 = user.matkul.some(mk => matkulSem1.includes(mk));
                            let ngajarSmt2 = user.matkul.some(mk => matkulSem2.includes(mk));
                            let passFilter = (filterSmt === 'all') || (filterSmt === "1" && ngajarSmt1) || (filterSmt === "2" && ngajarSmt2);

                            if (passFilter) {
                                count++;
                                let matkulList = user.matkul ? user.matkul.join(', ') : '-';
                                let labelId = user.role === 'dosen' ? 'NIP' : 'ID';
                                let badgeClass = user.role === 'dosen' ? 'badge-active' : 'badge-inactive';
                                let styleBadge = user.role === 'asprak' ? 'background-color:#e3f2fd; color:#1e88e5;' : '';

                                grid.innerHTML += `
                                    <div class="student-profile-card">
                                        <div class="card-action-menu" onclick="hapusAkun('${user.userId}')" style="cursor:pointer; color:#ef4444;"><i class="fas fa-trash"></i></div>
                                        <h3 class="student-card-name">${user.nama}</h3>
                                        <p class="student-card-id">${labelId}. ${user.userId}</p>
                                        <span class="badge ${badgeClass}" style="${styleBadge}">${user.role.toUpperCase()}</span>
                                        <div class="card-meta-details" style="margin-top:15px;">
                                            <div class="meta-row" title="${matkulList}"><span>Mengajar</span><strong style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px; text-align:right;">${matkulList}</strong></div>
                                        </div>
                                    </div>`;
                            }
                        }
                    } catch(e) {}
                }
            }
            if (count === 0) grid.innerHTML = '<h3 style="grid-column: 1 / -1; text-align: center; color: #888;">Tidak ada data pengajar di semester ini.</h3>';
        }

        // --- 3. CRUD DOSEN & ASPRAK ---
        function renderMatkulPengajar() {
            const role = document.getElementById('pengajarRole').value;
            const container = document.getElementById('matkulPengajarContainer');
            let html = '<p style="margin-bottom: 4px; font-weight: 600;">Pilih Matkul:</p>';

            if (role === 'dosen') {
                html += '<p style="font-size:11px; color:#ef4444;">(Pilih 1 Matkul)</p>';
                semuaMatkul.forEach(mk => html += `<label style="display:flex; gap:8px; margin-bottom:6px;"><input type="radio" name="mkDosen" value="${mk}"> ${mk}</label>`);
                container.innerHTML = html;
            } else {
                html += '<p style="font-size:11px; color:#ef4444;">(Maksimal 2 Matkul)</p>';
                matkulAsprak.forEach(mk => html += `<label style="display:flex; gap:8px; margin-bottom:6px;"><input type="checkbox" class="cb-asprak" value="${mk}"> ${mk}</label>`);
                container.innerHTML = html;
                document.querySelectorAll('.cb-asprak').forEach(cb => {
                    cb.addEventListener('change', function() {
                        if(document.querySelectorAll('.cb-asprak:checked').length > 2) { this.checked = false; alert("Maks 2 Praktikum!"); }
                    });
                });
            }
        }

        window.simpanPengajar = function() {
            const role = document.getElementById('pengajarRole').value, nama = document.getElementById('pengajarNama').value, id = document.getElementById('pengajarId').value, pass = document.getElementById('pengajarPass').value;
            let matkul = [];
            
            if (role === 'dosen') {
                let radio = document.querySelector('input[name="mkDosen"]:checked');
                if (radio) matkul.push(radio.value);
            } else {
                matkul = Array.from(document.querySelectorAll('.cb-asprak:checked')).map(cb => cb.value);
            }

            if(!nama || !id || !pass) return alert("Isi Data Utama!");
            if(matkul.length === 0) return alert("Pilih Matkul!");
            if(localStorage.getItem(id)) return alert("ID Terdaftar!");
            
            localStorage.setItem(id, JSON.stringify({role, nama, userId: id, password: pass, semester: "-", matkul}));
            document.getElementById('modalTambahDosen').style.display = 'none';
            muatDataPengajar(); syncNotifications(); alert("Pengajar Berhasil Ditambahkan!");
        };

        window.hapusAkun = function(id) { 
            if(confirm("Hapus ID: " + id + "?")) { localStorage.removeItem(id); muatDataPengajar(); syncNotifications(); } 
        };

        document.addEventListener('DOMContentLoaded', () => {
            syncNotifications(); muatDataPengajar();
            document.getElementById('btnBukaModalDosen').addEventListener('click', () => {
                document.getElementById('pengajarRole').value = 'dosen'; renderMatkulPengajar();
                document.getElementById('modalTambahDosen').style.display = 'flex';
            });
        });
    </script>
</body>
</html>
