<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Absensi | Edu-Free Mahasiswa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0f172a; --bg-sidebar: #1e293b; --bg-card: rgba(30, 41, 59, 0.85); --primary: #38bdf8; --secondary: #c084fc; --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: rgba(255, 255, 255, 0.1); --sidebar-width: 260px; --success-green: #22c55e; --warning-yellow: #f59e0b; --danger-red: #ef4444; }
        body:has(#theme-toggle:checked) { --bg-dark: #f8fafc; --bg-sidebar: #ffffff; --bg-card: rgba(255, 255, 255, 0.9); --primary: #0284c7; --secondary: #9333ea; --text-main: #0f172a; --text-muted: #475569; --border-color: rgba(0, 0, 0, 0.1); }
        .icon-sun { display: none; } body:has(#theme-toggle:checked) .icon-moon { display: none; } body:has(#theme-toggle:checked) .icon-sun { display: inline; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; transition: all 0.3s ease; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; } ul { list-style: none; }

        /* SIDEBAR */
        .sidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 1000; overflow-y: auto; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 1.8rem; font-weight: 800; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; color: transparent; }
        .theme-switch-wrapper { padding: 15px 20px; border-bottom: 1px solid var(--border-color); } .theme-toggle-label { cursor: pointer; color: var(--text-muted); display: flex; gap: 10px; font-size: 0.95rem; font-weight: 500;} .theme-checkbox { display: none; } 
        .nav-links { padding-top: 15px; flex-grow: 1;}
        .nav-links li a { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; color: var(--text-muted); font-weight: 500; transition: all 0.3s ease; cursor: pointer;}
        .nav-links li a:hover { background-color: rgba(148, 163, 184, 0.1); color: var(--text-main); padding-left: 25px; }
        .nav-links li a.active { background-color: rgba(56, 189, 248, 0.15); color: var(--primary); border-left: 4px solid var(--primary); font-weight: 600; }

        /* MAIN CONTENT */
        .main-content { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); min-height: 100vh; padding: 40px; }
        header { margin-bottom: 30px; } header h2 { font-size: 2rem; font-weight: 700; margin-bottom: 5px; } header p { color: var(--text-muted); }

        .table-container { background: var(--bg-card); padding: 30px; border-radius: 20px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-width: 800px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: var(--text-muted); padding: 15px; border-bottom: 1px solid var(--border-color); font-weight: 500;}
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--text-main); font-size: 0.95rem; vertical-align: middle;}
        
        .badge-status { padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; display: inline-block; text-align: center; min-width: 80px;}
        .bg-hadir { background: rgba(34, 197, 94, 0.15); color: var(--success-green); border: 1px solid rgba(34, 197, 94, 0.3); }
        .bg-izin { background: rgba(245, 158, 11, 0.15); color: var(--warning-yellow); border: 1px solid rgba(245, 158, 11, 0.3); }
        .bg-sakit { background: rgba(56, 189, 248, 0.15); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.3); }
        .bg-alpha { background: rgba(239, 68, 68, 0.15); color: var(--danger-red); border: 1px solid rgba(239, 68, 68, 0.3); }
        .bg-kosong { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px dashed var(--border-color); }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-header"><div class="logo">Edu-Free.</div></div>
        <div class="theme-switch-wrapper">
            <input type="checkbox" id="theme-toggle" class="theme-checkbox">
            <label for="theme-toggle" class="theme-toggle-label"><span class="icon-moon">🌙 Mode Gelap</span><span class="icon-sun">☀️ Mode Terang</span></label>
        </div>
        <ul class="nav-links">
            <li><a href="indexsetelahlogin2.html">Beranda</a></li>
            <li>
                <a class="dropdown-btn">Materi Semester 2 <span class="arrow">▼</span></a>
            </li>
            <li><a href="absensimahasiswa.html" class="active">Absensi</a></li>
            <li>
            <a href="tugas2.html">Tugas</a>
            </li>
            <li><a href="kuis.html">Kuis</a></li>
            <li><a href="uts_uas.html">UTS/UAS</a></li>
            <li><a href="nilai2.html">Nilai</a></li>
            <li><a href="forumkomunikasimahasiswa.html">Forum Diskusi</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header>
            <h2>Rekap Kehadiran Anda</h2>
            <p>Catatan absensi dari Pertemuan 1 hingga Pertemuan 16.</p>
        </header>

        <section class="table-container">
            <table>
                <thead><tr><th>Mata Kuliah / Kelas</th><th>Pertemuan</th><th>Tanggal</th><th>Status</th></tr></thead>
                <tbody id="tabel-rekap-body">
                    </tbody>
            </table>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Verifikasi Login Mahasiswa
            const user = JSON.parse(localStorage.getItem('loggedInUser'));
            if (!user) { window.location.href = "login.html"; return; }

            // Tema & Logout
            const themeToggle = document.getElementById("theme-toggle");
            if (localStorage.getItem("theme") === "light") themeToggle.checked = true;
            themeToggle.addEventListener("change", function() { localStorage.setItem("theme", this.checked ? "light" : "dark"); });
            document.getElementById('logout-sidebar').addEventListener('click', (e) => { e.preventDefault(); localStorage.removeItem('loggedInUser'); window.location.href = "index.html"; });

            // ==========================================
            // LOGIKA MENAMPILKAN 16 PERTEMUAN
            // ==========================================
            const dbAbsensi = JSON.parse(localStorage.getItem('global_database_absensi')) || [];
            const tbody = document.getElementById('tabel-rekap-body');
            
            tbody.innerHTML = "";

            // Looping dari Pertemuan 1 sampai 16
            for (let i = 1; i <= 16; i++) {
                // Cari data absensi yang Pertemuannya = i DAN NIM-nya sama dengan user login (Super Aman dengan String)
                const record = dbAbsensi.find(x => String(x.pertemuan) === String(i) && String(x.nim) === String(user.userId));
                
                const tanggal = record ? record.tanggal : '<span style="color: var(--text-muted);">-</span>';
                const status = record ? record.status : 'Belum Ada Data';
                
                // Menentukan warna badge (label)
                let badgeClass = 'bg-kosong';
                if (status === 'Hadir') badgeClass = 'bg-hadir';
                if (status === 'Izin') badgeClass = 'bg-izin';
                if (status === 'Sakit') badgeClass = 'bg-sakit';
                if (status === 'Alpha') badgeClass = 'bg-alpha';

                tbody.innerHTML += `
                    <tr>
                        <td><strong>DPW (Kelas IF 2B)</strong></td>
                        <td>Pertemuan ${i}</td>
                        <td>${tanggal}</td>
                        <td><span class="badge-status ${badgeClass}">${status}</span></td>
                    </tr>
                `;
            }
        });
    </script>
</body>
</html>
