<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi DPW | Edu-Free</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           TEMA & RESET DASAR
        ========================================= */
        :root { 
            --bg-dark: #0f172a; --bg-sidebar: #1e293b; --bg-card: rgba(30, 41, 59, 0.85); 
            --primary: #38bdf8; --secondary: #c084fc; --text-main: #f8fafc; 
            --text-muted: #94a3b8; --border-color: rgba(255, 255, 255, 0.1); 
            --sidebar-width: 260px; --danger-red: #ef4444; 
            --banner-gradient: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        
        body:has(#theme-toggle:checked) { 
            --bg-dark: #f8fafc; --bg-sidebar: #ffffff; --bg-card: rgba(255, 255, 255, 0.9); 
            --primary: #0284c7; --secondary: #9333ea; --text-main: #0f172a; 
            --text-muted: #475569; --border-color: rgba(0, 0, 0, 0.1); 
            --banner-gradient: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
        }
        
        .icon-sun { display: none; } 
        body:has(#theme-toggle:checked) .icon-moon { display: none; } 
        body:has(#theme-toggle:checked) .icon-sun { display: inline; color: #f59e0b; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; transition: all 0.3s ease; overflow-x: hidden; min-height: 100vh;}
        a { text-decoration: none; color: inherit; } ul { list-style: none; }

        /* =========================================
           SIDEBAR MAHASISWA
        ========================================= */
        .sidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 1000; overflow-y: auto; }
        .sidebar::-webkit-scrollbar { width: 5px; } .sidebar::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; padding: 25px 20px; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 1.8rem; font-weight: 800; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; color: transparent; }
        
        .theme-switch-wrapper { padding: 15px 20px; border-bottom: 1px solid var(--border-color); } 
        .theme-toggle-label { cursor: pointer; color: var(--text-muted); display: flex; gap: 10px; font-size: 0.95rem; font-weight: 500;} 
        .theme-checkbox { display: none; } 
        
        .nav-links { padding-top: 15px; flex-grow: 1; padding-bottom: 30px;} 
        .nav-links li a { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; color: var(--text-muted); font-weight: 500; transition: all 0.3s ease; cursor: pointer; }
        .nav-links li a:hover { background-color: rgba(148, 163, 184, 0.1); color: var(--text-main); padding-left: 25px; }
        .nav-links li a.active { background-color: rgba(56, 189, 248, 0.15); color: var(--primary); border-left: 4px solid var(--primary); font-weight: 600; }

        .dropdown-btn { cursor: pointer; } .arrow { font-size: 0.7rem; transition: transform 0.3s ease; } .dropdown-btn.open .arrow { transform: rotate(180deg); }
        .dropdown-container { display: none; background-color: rgba(0, 0, 0, 0.05); flex-direction: column; } .dropdown-container.show { display: flex; } 
        .dropdown-container li a { padding: 12px 20px 12px 40px; font-size: 0.95rem; border-left: none !important; } 
        .dropdown-container li a:hover { padding-left: 45px; color: var(--primary);}
        .dropdown-container li a.sub-active { color: var(--primary); font-weight: 700; background: rgba(56, 189, 248, 0.05); border-radius: 8px;}

        /* =========================================
           KONTEN UTAMA (DASHBOARD KELAS)
        ========================================= */
        .main-content { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); min-height: 100vh; padding: 40px 50px; }
        
        /* 1. BANNER HEADER MATKUL (Gaya Foto Pertama) */
        .matkul-header { display: flex; flex-direction: column; justify-content: center; margin-bottom: 30px; padding: 40px 50px; border-radius: 24px; background: var(--banner-gradient); box-shadow: var(--shadow-sm); position: relative; overflow: hidden; border: 1px solid var(--border-color);}
        .matkul-header::after { content: ''; position: absolute; right: 0; top: 0; width: 50%; height: 100%; background-image: radial-gradient(rgba(255,255,255,0.1) 2px, transparent 2px); background-size: 20px 20px; opacity: 0.5; pointer-events: none;}
        .matkul-title-box { z-index: 2; position: relative; }
        .matkul-title-box h1 { font-size: 2.5rem; color: #ffffff; margin-bottom: 8px; font-weight: 800; letter-spacing: -0.5px;}
        body:has(#theme-toggle:checked) .matkul-title-box h1 { color: var(--text-main); }
        .matkul-title-box p { color: rgba(255,255,255,0.8); font-size: 1.05rem; font-weight: 500; display: flex; align-items: center; gap: 8px;}
        body:has(#theme-toggle:checked) .matkul-title-box p { color: var(--text-muted); }
        
        /* 2. TAB NAVIGASI KELAS */
        .tabs { display: inline-flex; gap: 5px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 16px; border: 1px solid var(--border-color); margin-bottom: 30px; }
        body:has(#theme-toggle:checked) .tabs { background: #ffffff; box-shadow: var(--shadow-sm); }
        .tab-btn { background: transparent; border: none; padding: 12px 24px; border-radius: 12px; color: var(--text-muted); font-weight: 600; font-size: 0.9rem; transition: all 0.3s; display: flex; align-items: center; gap: 8px; text-decoration: none;}
        .tab-btn:hover { color: var(--text-main); }
        .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }

        /* 3. KONTEN TAB (GRID MATERI SEPERTI FOTO KEDUA) */
        .tab-content { background: transparent; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .section-title-tab { margin-bottom: 25px; font-size: 1.5rem; color: var(--text-main); font-weight: 700; display: flex; align-items: center; gap: 10px;}

        .materi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
        
        .materi-card { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); border-radius: 16px; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.3s ease; cursor: pointer; text-align: center;}
        body:has(#theme-toggle:checked) .materi-card { background: var(--bg-card); box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        
        .materi-card:hover { transform: translateY(-5px); border-color: var(--primary); background: rgba(56, 189, 248, 0.05); }
        
        .materi-icon { font-size: 3.5rem; color: #cbd5e1; margin-bottom: 20px; transition: 0.3s; }
        body:has(#theme-toggle:checked) .materi-icon { color: #94a3b8; }
        .materi-card:hover .materi-icon { color: var(--primary); transform: scale(1.1); }
        
        .materi-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; color: var(--text-main); }
        .materi-link { color: var(--primary); font-weight: 800; font-size: 1.2rem; }

        /* JIKA MATERI KOSONG */
        .empty-materi { text-align: center; color: var(--text-muted); font-size: 1.1rem; grid-column: 1 / -1; padding: 60px 20px; background: rgba(0,0,0,0.1); border-radius: 16px; border: 1px dashed var(--border-color); }
        body:has(#theme-toggle:checked) .empty-materi { background: #f8fafc; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-header"><div class="logo">Edu-Free.</div></div>
        
        <div class="theme-switch-wrapper">
            <input type="checkbox" id="theme-toggle" class="theme-checkbox">
            <label for="theme-toggle" class="theme-toggle-label"><span class="icon-moon">🌙 Mode Gelap</span><span class="icon-sun">☀️ Mode Terang</span></label>
        </div>
        
        <ul class="nav-links">
            <li><a href="../Dashboard_Mahasiswa/semester/indexsemester2.html">Beranda</a></li>
            <li>
                <a class="dropdown-btn open">
                    Materi Semester 2 
                    <span class="arrow"><i class="fas fa-chevron-down" style="transform: rotate(180deg);"></i></span>
                </a>
                <ul class="dropdown-container show">
                    <li><a href="materidpw.html" class="sub-active">DPW</a></li>
                    <li><a href="materistrukdat.html">Struktur Data</a></li>
                </ul>
            </li>
        </ul>
    </nav>

    <main class="main-content">
        
        <div class="matkul-header">
            <div class="matkul-title-box">
                <h1 id="header-judul-matkul">Memuat Mata Kuliah...</h1>
                <p><i class="fas fa-graduation-cap"></i> Program Studi Teknik Informatika — Semester 2</p>
            </div>
        </div>

        <nav class="tabs">
            <a href="absensimahasiswa.html" class="tab-btn"><i class="fas fa-user-check"></i> Kehadiran</a>
            <a href="#" class="tab-btn active"><i class="fas fa-book-open"></i> Materi</a>
            <a href="tugas2.html" class="tab-btn"><i class="fas fa-laptop-code"></i> Tugas</a>
            <a href="daftarmahasiswa.html" class="tab-btn"><i class="fas fa-star"></i> Penilaian</a>
            <a href="forumdiskusimahasiswa.html" class="tab-btn"><i class="fas fa-comments"></i> Diskusi Kelas</a>
        </nav>

        <div class="tab-content active">
            <h2 class="section-title-tab"><i class="fas fa-folder-open" style="color: var(--primary);"></i> Modul & Referensi Belajar</h2>
            
            <div class="materi-grid" id="materi-container">
                </div>
        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. VERIFIKASI LOGIN
            const user = JSON.parse(localStorage.getItem('loggedInUser'));
            if (!user) { window.location.href = "login.html"; return; }

            // 2. LOGIKA TEMA (GELAP / TERANG)
            const themeToggle = document.getElementById("theme-toggle");
            if (localStorage.getItem("theme") === "light") themeToggle.checked = true;
            themeToggle.addEventListener("change", function() { localStorage.setItem("theme", this.checked ? "light" : "dark"); });

            // 3. LOGIKA DROPDOWN SIDEBAR
            var dropdowns = document.getElementsByClassName("dropdown-btn");
            for (var i = 0; i < dropdowns.length; i++) {
                dropdowns[i].addEventListener("click", function(e) {
                    e.preventDefault(); 
                    this.classList.toggle("open");
                    var content = this.nextElementSibling;
                    if (content.classList.contains("show")) {
                        content.classList.remove("show");
                    } else {
                        content.classList.add("show");
                    }
                });
            }

            // =========================================================
            // 4. LOGIKA INTI: FILTER MATERI KHUSUS MATKUL INI SAJA
            // =========================================================
            
            // UBAH VARIABEL INI SESUAI FILE MATKULNYA
            // Jika file ini adalah 'materistrukdat.html', ubah menjadi "Struktur Data"
            const CURRENT_MATKUL = "DPW"; 
            const NAMA_PANJANG_MATKUL = "Dasar Pemrograman Web"; 

            // Atur Judul Banner Secara Dinamis
            document.getElementById('header-judul-matkul').textContent = NAMA_PANJANG_MATKUL;

            // Ambil brankas materi dari LocalStorage
            const dbMateriRaw = localStorage.getItem('global_database_materi');
            const databaseMateri = dbMateriRaw ? JSON.parse(dbMateriRaw) : [];

            // FILTER KETAT: Tarik hanya data yang 'matkul' nya sesuai
            const materiMatkulIni = databaseMateri.filter(m => m.matkul === CURRENT_MATKUL);
            
            const materiContainer = document.getElementById('materi-container');

            // Render ke layar
            if (materiMatkulIni.length > 0) {
                materiContainer.innerHTML = ""; // Bersihkan kontainer
                
                materiMatkulIni.forEach((materi) => {
                    materiContainer.innerHTML += `
                        <a href="${materi.link}" target="_blank" class="materi-card">
                            <i class="fas fa-file-alt materi-icon"></i>
                            <div class="materi-title">${materi.judul}</div>
                            <span class="materi-link">-</span>
                        </a>
                    `;
                });
            } else {
                // Tampilan Empty State (Jika Kosong)
                materiContainer.innerHTML = `
                    <div class="empty-materi">
                        Belum ada materi ${CURRENT_MATKUL} yang diunggah oleh Dosen.
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
